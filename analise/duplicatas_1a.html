sse o seu representante legal. Ora, a assinatura do contrato dentro do estabelecimento da autora, por um funcionário seu, permite o reconhecimento da validade do contrato, pela teoria da aparência. A ré não é obrigada a saber se determinado funcionário tem ou não poderes para celebrar contratos. A assinatura do contrato por funcionário dentro do estabelecimento da autora é suficiente para reconhecer sua validade. Além disso, a autora não comprovou que seu funcionário tenha sido induzido em erro. A única testemunha ouvida foi o próprio ex-funcionário, que, por óbvio, não pode ser considerado como prova suficiente do alegado vício de consentimento, já que inteiramente envolvido no caso. A redação do contrato é muito clara e não deixa dúvida de que se tratava de novo contrato, inclusive com especificação de preço e forma de pagamento. Assim, não convence a alegação da autora de que seu funcionário teria sido ludibriado pela ré. O fato de haverem outras ações contra a ré, com mesma alegação, não é suficiente para, por si só, justificar o acolhimento do pedido, se, neste caso, nada há a sustentar a alegação da autora. Dessa forma, sendo válido o contrato, permanece também válido o título, sendo legítimo, pela falta de pagamento, o protesto. Ressalto que o objeto da ação se limita a tais alegações, não cabendo invalidação do título por outras que fogem ao objeto desta. Ante o exposto,",". Uma vez que as provas produzidas nos autos são suficientes ao deslinde do feito, promovo o julgamento antecipado do mérito, nos termos do art. 355, I, do CPC. Entendo, ante as especificidades do caso, aplica-se o Código de Defesa do Consumidor, pois, apesar de se tratar de uma relação jurídica firmada entre duas empresas, o produto em questão não compõe a cadeia produtiva da autora; outrossim, ainda que se entenda que suposto anúncio poderia representar um incremento publicitário em proveito da atividade produtiva da autora, considera-se ser a requerente empresa que atua no comércio varejista de rações, artigos agropecuários, veterinários, entre outros (p. 22), assim, não possui qualquer conhecimento na área de atuação da ré, qual seja, publicidade. Assim, de rigor a aplicação da Teoria Finalista Mitigada, diante da vulnerabilidade técnica da parte autora, conforme determina a jurisprudência do Colendo STJ: AGRAVO REGIMENTAL NO AGRAVO EM RECURSO ESPECIAL CIVIL. PROCESSO CIVIL. RECURSO MANEJADO SOB A ÉGIDE DO CPC/73. AÇÃO DE INDENIZAÇÃO. RECURSO ESPECIAL. PESSOA JURÍDICA. AÇÃO DE INDENIZAÇÃO. APLICAÇÃO DO CDC. TEORIA FINALISTA MITIGADA. PRESCRIÇÃO QUINQUENAL. ART. 27 DO CDC. SÚMULA Nº 83 DO STJ. AGRAVO REGIMENTAL NÃO PROVIDO. 1. Inaplicabilidade do NCPC a este julgamento ante os termos do Enunciado nº 1 aprovado pelo Plenário do STJ na sessão de 9/3/2016: Aos recursos interpostos com fundamento no CPC/1973 (relativos a decisões publicadas até 17 de março de 2016) devem ser exigidos os requisitos de admissibilidade na forma nele prevista, com as interpretações dadas até então pela jurisprudência do Superior Tribunal de Justiça. 2. A jurisprudência desta Corte tem mitigado os rigores da teoria finalista para autorizar a incidência do CDC nas hipóteses em que a parte (pessoa física ou jurídica), embora não seja tecnicamente a destinatária final do produto ou serviço, se apresente em situação de vulnerabilidade. Tem aplicação a Súmula nº 83 do STJ. 3. Agravo regimental não provido. (AgRg no AREsp 646.466/ES, Rel. Ministro MOURA RIBEIRO, TERCEIRA TURMA, julgado em 07/06/2016, DJe 10/06/2016) No mérito,afirma a requerida que o representante da autora aderiu ao Contrato de Figuração nº 96825 G (fls. 65), pelo qual teria anuído com a contratação dos serviços da ré para inclusão dos dados da empresa em seu em site na internet pelos anos de 2022, 2023 e 2024, comprometendo-se a pagar 36 parcelas mensais e sucessivas no importe de R$ 350,00 (fls. 65), no total de R$ 12.600,00. A autora afirma, por outro lado, que teria sido induzida a erro, pois anuiu com a proposta veiculado por telefone de figurar em uma lista telefônica virtual divulgada pela VIVO, pelo custo mensal de R$ 15,00 que seriam incluídos na fatura emitida pela Concessionária, constatando a divergência entre o contrato ofertado e a cobrança encetada somente com o recebimento do primeiro boleto de cobrança. A versão da autora possui ampla verossimilhança considerando as seguintes circunstancias; (a) o contrato de p. 65 foi firmado em 14/06/2022 e a ação foi ajuizada em 19/07/2022, indicando que logo após o recebimento da primeira cobrança o representante da autora teria constatado a divergência entre a proposta e os dizeres do contrato, adotando as medidas cabíveis para buscar a rescisão administrativa e, em seguida, a rescisão judicial do contrato por vício de consentimento, antes de usufruir substancialmente dos serviços. Não é crível que a empresa apresentaria a mentirosa versão de que foi vítima de um estelionato apenas para se beneficiar durante um mês da figuração de seu banner do site da ré; (b) a autor trouxe elementos que indicam que diversas outras empresas reclamam do induzimento à contratação com semelhante modus operandi, conforme relação de demandas judiciais pelas quais a ré responde e diversas reclamações veiculadas no website \"Reclame Aqui\" (pp. 04/06); (c) o contrato de p. 65 não é claro o bastante quanto aos serviços contratados e quanto à contraprestação, seja porque não redigido de forma clara e objetiva, seja porque impresso em fonte miúda, prejudicando o entendimento do aderente, em violação ao art. 46 do CDC; (d) o valor cobrado pelo serviço prestado - mera inserção de um banner em nome da autora no site da requerida, sem qualquer ilustração (p. 69) - revela-se desproporcional em relação ao preço, o que, além de fazer incidir, o art. 51, IV do CDC, corrobora a versão da autora de que não teria anuído com a contratação nestes moldes. Assim, ante a verossimilhança das alegações do autor, conforme art. 6º, VIII do CDC, aplicável ao caso, incumbia à requerida fazer prova que a contratação foi idônea, inclusive com a juntada da gravação da negociação efetivada via telefone, na qual o autor alega ter sido induzido a erro. Pondera-se, ainda, que desde a concessão da tutela de urgência (p. 37), presumidamente teria a ré deixado de veicular a publicidade em nome da empresa requerente em seu website, inexistindo, portanto, substancial prestação de serviço que deva ser remunerada pelo requerente. Nesses termos, é caso de julgar procedente a ação, com a rescisão do contrato. Em sentido similar: AÇÃO DECLARATÓRIA DE INEXISTÊNCIA DE RELAÇÃO JURÍDICA C.C. INDENIZAÇÃO POR DANO MORAL JULGADA PROCEDENTE – CONTRATO DE PRESTAÇÃO DE SERVIÇOS DE PUBLICIDADE EM MÍDIA DA INTERNET – NEGATIVA DE CONTRATAÇÃO – COMPETÊNCIA DO FORO DE ORIGEM MANTIDA – impossibilidade de reconhecimento de incompetência relativa depois de sentenciado o feito – insurgência a respeito que deveria se dar por meio de agravo de instrumento – inexistência de incremento da atividade do apelado – existência da relação negocial negada – falta de provas sobre a prestação de qualquer serviço – como a apelante se apresenta como prestadora de serviço, sendo negada a contratação pelo apelado, a relação deve ser considerada de ordem consumerista – correção do ajuizamento da ação no foro do domicílio do apelado – instrumento contratual apresentado que claramente não foi assinado pelo apelado que negou que o tenha feito – ônus de comprovar a higidez do documento que era da apelante, nos termos do art. 429, II do CPC – inexistência de dívida corretamente declarada – dano moral – inocorrência – falta de prova da perpetração do cadastro indevido do nome do apelado – sentença reformada no ponto – litigância de má-fé da parte da apelante reconhecida e não questionada – multa e indenização bem arbitradas, sendo descabido o aumento pedido pelo apelado – requerimento de expedição de ofício ao Ministério Público para as providências cabíveis – hipótese que é mesmo de comunicação à referida autoridade, o que fica determinado, ante a possibilidade de ter havido a falsificação de documento particular por parte da apelante, bem como considerado que se trata aparentemente de conduta reiterada, a demandar análise na esfera penal. Resultado: recurso parcialmente provido, com determinação. (TJSP; Apelação Cível 1007347-09.2020.8.26.0506; Relator (a): Castro Figliolia; Órgão Julgador: 12ª Câmara de Direito Privado; Foro de Ribeirão Preto - 5ª Vara Cível; Data do Julgamento: 11/01/2022; Data de Registro: 11/01/2022) Diante do exposto,","SENTENÇA Processo nº: 1074905-81.2022.8.26.0100 Classe - Assunto Procedimento Comum Cível - Defeito, nulidade ou anulação Requerente: Racões & Cia - Nogueira & Bertozzi Comércio de Rações Ltda - Me Requerido: A R de Araújo Comunicações Me (Guia Plus) Juiz(a) de Direito: Dr(a). Antonio Carlos de Figueiredo Negreiros Ante a expressa concordância do autor vencedor com o valor do depósito voluntário comprovado nos autos,"],["JULGO PROCEDENTE a ação, nos termos do artigo 487, inciso I do CPC, para DECLARAR inexistente o contrato e o débito, melhor descritos na inicial. Corolário lógico é exclusão do apontamento negativo, caso ainda necessário, consolidando-se a antecipação de tutela. Sem custas e honorários, pois incabíveis nesta fase processual (art. 55, “caput”, da LJE). Não havendo a satisfação da obrigação, poderá a parte autora ingressar com pedido de cum","JULGO EXTINTA a presente ação, a teor do artigo 487, inciso III, letra b, c.c. 924, inciso II, do Código de Processo Civil. Defiro, desde logo, o levantamento de eventual depósito efetivado nos autos, expedindo-se o respectivo mandado a favor de quem de direito, com a ressalva de que é atribuição do juízo apenas a baixa das restrições por ele efetivadas (por exemplo: restrições nos bureaus de crédito, Renajud, Sisbajud, Arisp, etc); não cabendo ao juízo a retirada daquelas realizadas pelas partes. Como é manifesto que não há interesse recursal, determino que a Serventia certifique o imediato trânsito em julgado da presente decisão. Após efetivadas as anotações de estilo, arquive-se. ",null,null,null,"JULGO EXTINTO o processo nos termos do art. 924, II do CPC. 2 - Após o trânsito em julgado e preenchidas as formalidades legais, remetam-se os autos ao arquivo com as anotações e comunicações de praxe. ",null,"JULGO EXTINTO o processo nos termos do art. 924, II, do CPC. Expeça-se mandado de levantamento conforme requerido a fls. 46 Após, cum",null,"JULGO EXTINTO o processo, com base no artigo 924, II, do Novo Código de Processo Civil. Fica o executado intimado, na pessoa de seu Procurador, para que, em 10 dias, efetue o recolhimento da taxa judiciária final (1% do valor respectivo, observado o valor mínimo - guia DARE, cód. 230-6), sob pena de inscrição da dívidao que fica já determinado em caso de não pagamento. Efetuado o recolhimento das custas finais, proceda-se a consulta da situação da guia DARE ou a sua inserção no sistema SAJPG5 (menus \"Cadastro\" ou \"Retificação de Processo\" – aba \"Despesas Processuais\"), certificando-se. Confirmado o pagamento, arquivem-se os autos com baixa definitiva. Aguarde-se o recolhimento por quinze dias, e, na inércia, expeça-se certidão, encaminhando-a à Procuradoria da Fazenda Estadual para inscrição em dívida ativa. Precluso o direito de recorrer, por inexistência de interesse processual, certifique a Serventia o trânsito em julgado. Oportunamente, procedam-se as anotações necessárias no sistema e arquivem-se os autos definitivamente. P.I.C. Santos, 05 de julho de 2023.","JULGO EXTINTA a execução com fundamento no artigo 924, inciso II, do Código de Processo Civil. Arcará a exequente com honorários advocatícios no percentual de 10% do valor cobrado indevidamente. Dispensado o recolhimento de custas finais, na ausência de atos constritivos. Oportunamente, proceda-se às anotações e comunicações necessárias, arquivando-se os autos. ","JULGO EXTINTA a execução com fundamento no  para Cálculo de Atualização Monetária dos Débitos Judiciais do Tribunal de Justiça, arcando cada qual com os honorários advocatícios de seus patronos, que arbitro, respectivamente em 20% sobre o valor atualizado da causa. ","julgo EXTINTA a execução que Mercadante & Cardoso Ltda Me move contra A R de Araújo Comunicações Me- Guia Mais Plus, fazendo-o com fundamento no art. 924, II do Código de Processo Civil. Expeça-se mandado de levantamento em favor do exequente. Com o trânsito em julgado desta, o que a serventia certificará, proceda-se às anotações e comunicações de estilo para baixa no sistema, arquivando-se os autos oportunamente. ","JULGO PARCIALMENTE PROCEDENTE, com resolução de mérito, nos termos do art. 487, inciso I, do CPC, a presente ação ajuizada por PAULO HENRIQUE DA SILVA e PAULO HENRIQUE DA SILVA - ME contra A.R. DE ARAÚJO COMUNICAÇÕES ME (GUIA MAIS PLUS) para o fim de: a) CONDENAR a requerida ao pagamento de indenização por danos materiais no valor de R$ 210,00 (duzentos e dez reais), corrigidos monetariamente pela Tabela Prática do TJSP a contar do ajuizamento da ação e acrescidos de juros de mora de 1% ao mês, a partir da citação; b) DETERMINAR a parte requerida que se abstenha de inscrever o nome da parte requerente nos cadastros de inadimplentes, bem como deixe de protesta-la em cartório, por eventuais valores relacionados ao contrato objeto desta ação (n.º 17.648 fls. 22). Ante a sucumbência recíproca, condeno a parte autora e a requerida, nos termos do art. 86, caput, do CPC, na proporção de 50% (cinquenta por cento) para cada parte, ao pagamento das custas e despesas processuais comprovadas, bem como honorários de advogado que, a teor do art. 85, § 2º, do CPC, fixo em 10% (dez por cento) sobre o valor atualizado da causa, observando-se a referida proporção, ficando suspensa a exigibilidade de tais verbas em relação à parte autora, tendo em vista ser beneficiária da justiça gratuita (CPC, artigo 98, § 3º), vide fls. 39 e 53/54. P.I Marilia, 28 de novembro de 2019. DOCUMENTO ASSINADO DIGITALMENTE NOS TERMOS DA LEI 11.419/2006, CONFORME IMPRESSÃO À MARGEM DIREITA",null,"JULGO PROCEDENTE o pedido deduzido por MÁRCIO ROGÉRIO DE OLIVEIRA AUTO ELÉTRICA em face de A.R. DE ARAÚJO COMUNICAÇÕES ME, o que faço na forma do artigo 487, I, do Código de Processo Civil para declarar inexigíveis os títulos protestados (Duplicata Mercantil por Indicação protocolada sob nº 0019-23/06/2023-98, emissão em 22/06/2023, vencimento em 28/06/2023, no valor de R$ 409,48) e determinar o cancelamento definitivo dos apontamentos, ficando a cargo do réu a responsabilidade pelo pagamento das custas cartorárias relativas ao cancelamento. Em razão da sucumbência, arcará a ré com o pagamento das custas e despesas processuais, além de honorários advocatícios da parte adversa, que fixo no importe de 10% sobre o valor declarado inexigível. Ficam as partes, desde já, advertidas de que a oposição de embargos de declaração fora das hipóteses legais e/ou com postulação meramente de caráter infringente, ficará sujeita à imposição da multa prevista no artigo 1.026, § 2º, do Código de Processo Civil. Nos termos do artigo 489, § 1º, inciso IV, do CPC/16, todos os fundamentos que poderiam infirmar esta sentença foram enfrentados em sua fundamentação. Eventuais fundamentos que não tenham sido analisados, não o foram porque não alterariam a conclusão a que se chegou. ","JULGO PROCEDENTE o pedido deduzido por MÁRCIO ROGÉRIO DE OLIVEIRA AUTO ELÉTRICA em face de A.R. DE ARAÚJO COMUNICAÇÕES ME, o que faço na forma do artigo 487, I, do Código de Processo Civil para declarar inexigíveis os títulos protestados (Duplicata Mercantil por Indicação protocolada sob nº 0019-23/06/2023-98, emissão em 22/06/2023, vencimento em 28/06/2023, no valor de R$ 409,48) e determinar o cancelamento definitivo dos apontamentos, ficando a cargo do réu a responsabilidade pelo pagamento das custas cartorárias relativas ao cancelamento. Em razão da sucumbência, arcará a ré com o pa 55, da Lei nº 9.099/95. Diante da configuração da hipótese descrita no art. 1.000 do CPC, certifique-se o trânsito em julgado nesta data. Defiro o levantamento da quantia depositadas a fls. 128, em favor da credora, bem como das vincendas nos meses vindouros, expedindo-se, para tanto, os respectivos mandados de levantamento eletrônico, conforme formulário de fls. 133. Observo que em caso de descum","JULGO PROCEDENTE o pedido para declarar a nulidade da contratação entre as partes ( contratos 38291 e 38414) e, em decorrência, qualquer cobrança advinda da dita contratação, bem como para condenar a Ré a indenizar a Autora pelo valor de R$ 5.000,00, a ser corrigido desde esta data ( sumula 362 do STJ) pela tabela pró",null,"JULGO PARCIALMENTE PROCEDENTE o pedido formulado na ação ajuizada por CENTRO DE EDUCAÇÃO INFANTIL CAMORIN LTDA ME em face de A.R. DE ARAÚJO COMUNICAÇÕES ME (GUIA PLUS) para declarar rescindido o contrato firmado entre as partes a partir desta data, devendo a ré providenciar a baixa no sistema do contrato e de eventual débito existente. Definitiva a tutela concedida a fls. 52/53. Expeça-se guia de levantamento dos valores depositados a fls. 60/61 e 106 em favor da requerida, após trânsito em julgado da presente decisão. Sem condenação em verbas de sucumbência, consoante o disposto no artigo 55, da Lei 9.099/95. ",null,"JULGO PARCIALMENTE PROCEDENTES os pedidos iniciais, nos termos do artigo 487, I, do Código de Processo Civil, para, confirmada a tutela provisória anteriormente concedida, (i) declarar a inexigibilidade dos débitos indicados a fl. 41/44, determinando-se o cancelamento definitivo do protesto; e ii) condenar a ré ao pagamento de indenização por danos morais no valor de R$ 5.000,00, corrigido monetariamente pela Tabela Prática do E. Tribunal de Justiça de São Paulo desde o arbitramento e acrescidos de juros de mora de 1% ao mês, contados da citação. Em razão da sucumbência mínima e à luz da Súmula 326 do C. Superior Tribunal de Justiça, condeno a ré ao pagamento das despesas processuais e de honorários advocatícios, os quais fixo em 20% da condenação (a saber, o valor do débito declarado inexigível somado à verba indenizatória arbitrada). Sentença registrada eletronicamente. ","JULGO PARCIALMENTE PROCEDENTES os pedidos iniciais, nos termos do artigo 487, I, do Código de Processo Civil, para, confirmada a tutela provisória anteriormente concedida, (i) declarar a inexigibilidade dos débitos indicados a fl. 41/44, determinando-se o cancelamento definitivo do protesto; e ii) condenar a ré ao pagamento de indenização por danos morais no valor de R$ 5.000,00, corrigido monetariamente pela Tabela Prática do E. Tribunal de Justiça de São Paulo desde o arbitramento e acrescidos de juros de mora de 1% ao mês, contados da citação. Em razão da sucumbência mínima e à luz da Súmula 326 do C. Superior Tribunal de Justiça, condeno a ré ao pagamento das despesas processuais e de honorários advocatícios, os quais fixo em 20% da condenação (a saber, o valor do débito declarado inexigível somado à verba indenizatória arbitrada). Sentença registrada eletronicamente. ",null,null,"JULGO EXTINTO o feito com resolução de mérito, fazendo-o nos termos do art. 487, I, do Código de Processo Civil. Em face do resultado ora alcançado, fica à ré (70%) e à autora (30%) carreada a responsabilidade pelo pagamento das custas processuais e honorários advocatícios ao patrono do ex adverso, fixados em 10% sobre o valor atualizado da condenação, com a preservação da proporção fixada (70% de 10% do valor atualizado da condenação para advogado da parte autora, 30% de 10% do valor atualizado da condenação para advogado da ré), considerando-se novel regra processual a inadmitir compensações (CPC, art. 85, §14). Em caso de recurso de apelação, intime-se a parte contrária para, querendo, apresentar contrarrazões no prazo de 15 (quinze) dias úteis (art. 1.010, §1º, do CPC). Após, subam os autos ao Egrégio Tribunal de Justiça de São Paulo, com as homenagens e cautelas de estilo. Com o advento da Lei nº 13.105/2015, o juízo de admissibilidade é efetuado pelo juízo ad quem, na forma do artigo 1.010, § 3º, a seguir transcrito: “Após as formalidades previstas nos §§ 1º e 2º, os autos serão remetidos ao tribunal pelo juiz, independentemente de juízo de admissibilidade.”. Conforme Comunicado CG nº 916/2016, em conformidade com o disposto no artigo 1.010, §3º do NCPC e com a revogação do artigo 1.096 das NSCGJ (Provimento CG nº 17/2016), estão as unidades judiciárias dispensadas do cálculo e da indicação do valor do preparo recursal. Oportunamente, com o trânsito em julgado, aguarde-se por cinco dias manifestações das partes. No silêncio, remetam-se os autos ao arquivo provisório, com as cautelas de praxe e as formalidades legais. P.I.C. São Paulo, 12 de julho de 2019. DOCUMENTO ASSINADO DIGITALMENTE NOS TERMOS DA LEI 11.419/2006, CONFORME IMPRESSÃO À MARGEM DIREITA","JULGO EXTINTA a execução em trâmite, com fundamento no art. 924, inc. II, do Código de Processo Civil. Custas na forma da lei. Precluso o direito de recorrer por inexistência de interesse processual. Certifique-se o trânsito em julgado com a publicação desta. Expeça-se mandado de levantamento dos depósitos efetuados nos autos em favor do credor. Oficie-se a instituição financeira se necessário. Oportunamente, procedam-se as anotações de extinção, comunique-se e arquivem-se. P..I.C.. São Paulo, 04 de novembro de 2019. DOCUMENTO ASSINADO DIGITALMENTE NOS TERMOS DA LEI 11.419/2006, CONFORME IMPRESSÃO À MARGEM DIREITA","julgo improcedente a ação, nos termos do art. 487, I do CPC, e revogo a tutela anteriormente deferida (fls. 41/42). Em razão da sucumbência, a autora arcará com custas, despesas processuais e honorários advocatícios em favor dos procuradores da parte requerida, que arbitro em 15% do valor da causa atualizado, nos termos do art. 85, §2º do CPC. Notifique-se ao Cartório de Protesto sobre a revogação da tutela. P.I. Franca, 21/03/2025. DOCUMENTO ASSINADO DIGITALMENTE NOS TERMOS DA LEI 11.419/2006, CONFORME IMPRESSÃO À MARGEM DIREITA","julgo improcedente a ação, nos termos do art. 487, I do CPC, e revogo a tutela anteriormente deferida (fls. 41/42). Em razão da sucumbência, a autora arcará com custas, despesas processuais e honorários advocatícios em favor dos procuradores da parte requerida, que arbitro em 15% do valor da causa atualizado, nos termos do art. 85, §2º do CPC. Notifique-se ao Cartório de Protesto sobre a revogação da tutela. P.I. Franca, 21/03/2025. DOCUMENTO ASSINADO DIGITALMENTE NOS TERMOS DA LEI 11.419/2006, CONFORME IMPRESSÃO À MARGEM DIREITA","Ante o exposto, ACOLHO A PRELIMINAR arguida pela demandada e DECLARO A INCOMPETÊNCIA deste Juízo para processar o presente feito e, como consequência, após o decurso do prazo recursal, determino a remessa dos autos a uma das Varas Cíveis da Comarca de São Paulo/SP, com as homenagens de estilo. Anote-se e comunique-se. Int. Piracicaba, 20 de junho de 2022. DOCUMENTO ASSINADO DIGITALMENTE NOS TERMOS DA LEI 11.419/2006, CONFORME IMPRESSÃO À MARGEM DIREITA","Ante o exposto, ACOLHO A PRELIMINAR arguida pela demandada e DECLARO A INCOMPETÊNCIA deste Juízo para processar o presente feito e, como consequência, após o decurso do prazo recursal, determino a remessa dos autos a uma das Varas Cíveis da Comarca de São Paulo/SP, com as homenagens de estilo. Anote-se e comunique-se. Int. Piracicaba, 20 de junho de 2022. DOCUMENTO ASSINADO DIGITALMENTE NOS TERMOS DA LEI 11.419/2006, CONFORME IMPRESSÃO À MARGEM DIREITA",null,"JULGO EXTINTA a presente execução, com fundamento no art. 924, inciso II do Código de Processo Civil. Após o trânsito em julgado, arquivem-se os autos. ","JULGO PROCEDENTE a ação movida por AÇO NOBRE INDÚSTRIA LTDA. em face de A R DE ARAÚJO COMUNICAÇÕES GUIA PLUS, para condenar a ré à restituição do valor total de R$ 6.384,00, de forma dobrada, computados correção monetária e juros de mora das datas dos desembolsos, bem como a indenizar o d
