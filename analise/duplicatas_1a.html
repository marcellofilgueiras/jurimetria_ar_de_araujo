rcelas mensais de R$ 17,50. Aceita a oferta, recebeu por fax o contrato para ser assinado, quando então percebeu que a requerida havia alterado as condições do ajuste para pagamento de R$ 2.500,00 através de 12 parcelas de R$ 210,00. Mesmo estranhando, assinou o contrato pensando que seria mantida a proposta inicial de menor valor, vindo posteriormente, em janeiro de 2018, a receber diversos telefonemas de cobrança da importância de R$ 2.520,00, quando então, ao manter contato com a requerida, ficou sabendo que o contrato havia sido firmado com vigência para 36 meses, mediante pagamento anual de 12 parcelas de R$ 210,00, e que havia apontamento no Cartório de Protestos de um título de 5040,00 por conta de 24 parcelas a ele referentes, situação que não logrou solucionar, na medida em que foi exigido para cancelamento do contrato o pagamento de uma multa de 40% sobre o seu valor total. A requerida impugna a pretensão deduzida sob o argumento preliminar de não incidência das disposições do Código de Defesa do Consumidor ao caso, e no mérito, da inexistência do direito pretendido, quer pela existência de contratação entre as partes, quer pela prestação de serviços de anúncio à requerente na forma ajustada. Argumenta que o contrato é claro quanto ao valor do serviço, e que o valor exigido é legítimo diante da prestação do serviço contratado, sendo, portanto, justa a exigência de multa contratual para a rescisão pretendida. Por fim, reiterando a argumentação de inexistência de relação de consumo, sustenta a inexistência de dano moral indenizável. Rejeito a preliminar arguida com a defesa, vez que seus argumentos se confundem com o mérito da causa. No mérito, a parcial procedência do pedido é de rigor. Com efeito. Inicialmente, cumpre observar que as disposições do Código de Defesa do Consumidor não tem aplicação ao caso em espécie, porquanto a contratação efetuada pela autora não teve a mesma como destinatária final, mas sim a consecução de seu objeto social, no âmbito de relação jurídica empresarial, voltada à divulgação de seu nome no ramo de mecânica e reparos de veículos, de onde a ausência de submissão ao disposto no artigo 2º da Lei nº. 8.078/80. A propósito, e por pertinente à espécie, confira-se o julgado: DIREITO DO CONSUMIDOR. DEFINIÇÃO DE CONSUMIDOR E DE FORNECEDOR. NÃO CARACTERIZAÇÃO EMPRESA DE TRANSPORTE. RELEVÂNCIA, PARA A CONFIGURAÇÃO DA RELAÇÃO DE CONSUMO, DA DISPARIDADE DE PORTE ECONÔMICO EXISTENTE ENTRE PARTES DO CONTRATO DE FORNECIMENTO DE PEÇAS PARA CAMINHÃO EMPREGADO NA ATIVIDADE DE TRANSPORTE. IMPORTÂNCIA, TAMBÉM, DO PORTE DA ATIVIDADE PRATICADA PELO DESTINATÁRIO FINAL. SITUAÇÃO, ENTRETANTO, EM QUE, INDEPENDENTEMENTE ADEMAIS, DE RELAÇÃO DE CONSUMO, HÁ ELEMENTOS DE PROVA A EMBASAR A CONVICÇÃO DO JULGADOR DE QUE PEÇAS AUTOMOTIVAS FORNECIDAS E A CORRESPONDENTE PRESTAÇÃO DE SERVIÇO NÃO TÊM DEFEITOS. I - Não enquadrável como relação de consumo a prestação de serviços entre empresas de porte, não se caracterizando hipossuficiência da contratante de conserto de caminhão de transporte de cargas, situação em que não se tem consumidor final, mas, apenas, intermediário, afasta-se a incidência do Código de Defesa do Consumidor. II - Ainda que se aplicasse o Código de Defesa do Consumidor, a regra da inversão do ônus da prova (CDC, art. 6º, VIII) não seria suficiente para afastar a prova contrária à pretensão inicial, tal como detidamente analisada, inclusive quanto à perícia, pela sentença e pelo Acórdão. III - O Código de Defesa do Consumidor define consumidor como a pessoa física ou jurídica que adquire ou utiliza produto ou serviço como destinatário final, noção que, como a de fornecedor, é ideia-chave para a caracterização da relação de consumo. IV - O fato de a pessoa empregar em sua atividade econômica os produtos que adquire não implica, por si só, desconsiderá-la como destinatária final e, por isso, consumidora. No entanto, é preciso considerar a excepcionalidade da aplicação das medidas protetivas do CDC em favor de quem utiliza o produto ou serviço em sua atividade comercial. Em regra, a aquisição de bens ou a utilização de serviços para implementar ou incrementar a atividade negocial descaracteriza a relação como de consumo. Precedentes. V - O reconhecimento da existência da relação de consumo, por si só, não implica presunção de prova. Presentes elementos de prova a indicar que as peças automotivas fornecidas e a prestação do serviço correspondente não são defeituosos, pode o Juiz concluir em favor do fornecedor a despeito da inversão do ônus da prova. VI - Recurso Especial improvido. (STJ, 3ª Turma - REsp: 1038645/RS, Rel. Ministro Sidnei Beneti, J. em 19/10/2010) Assim observado, tem-se que a autora, como pessoa jurídica que é, a despeito de microempresária não pode ser considerada hipossuficiente a ponto de tentar subverter o valor e forma de pagamento fixado no contrato, ao argumento de “ter pensado que a pactuação se daria por valor inferior anteriormente ofertado pela preposta da requerida, quando do contato telefônico inicial”, visto que tal argumentação se mostra pueril diante da realidade dos fatos, que por sua vez, não permite conclusão da alegada ocorrência de “golpe da lista telefônica”. Ademais, o contrato firmado, embora simplista, é expresso quanto ao seu objeto, valor e forma de pagamento (fls.39), qual seja, R$ 2.520,00 por ano de divulgação, para pagamento através ficha de compensação bancária (boleto) em 12 parcelas de R$ 210,00. Dessa forma, demonstrada a prestação do serviço de anúncio pela requerida, expressamente admitida pela autora em sua inicial, se tem que os documentos apresentados à fls. 44/55 são imprestáveis à comprovação do pagamento ajustado, a legitimar a cobrança efetuada. Deste modo, não podem prosperar as alegações no sentido de desconhecimento por parte da contratante dos valores efetivamente cobrados pela publicação do anúncio, até porque não se vislumbra a comprovação de que tenha sido induzida a erro no momento da celebração do negócio. Ademais, como já observado, não nega que os serviços tenham sido efetivamente prestados, sendo a contraprestação, diante deste contexto, totalmente devida. Nessa esteira, pertinentes os arestos a seguir transcritos: PRESTAÇÃO DE SERVIÇOS DE PUBLICIDADE. DIVULGAÇÃO EM LISTA TELEFÔNICA. AÇÃO DECLARATÓRIA DE INEXISTÊNCIA DE NEGÓCIO JURÍDICO CUMULADA COM INDENIZAÇÃO POR DANOS MORAIS. CONSTATAÇÃO DA EXISTÊNCIA DO NEGÓCIO (CC, ARTS. 104 E 107). OBRIGAÇÃO EVIDENCIADA.IMPROCEDÊNCIA RECONHECIDA. RECURSO PROVIDO. A constatação de que houve a formação do contrato e isto ocorreu em conformidade com as regras gerais dos artigos 104 e 107 do Código Civil, estando as partes plenamente identificadas e aptas à contratação, sendo o objeto plenamente lícito e a formulação escrita suficiente para proporcionar a imediata compreensão, determina a impossibilidade de questionar a sua existência, validade e eficácia. (TJSP, 31ª Câmara de Direito Privado, Apelação n. 0204365-92.2009.8.26.0004, Rel. Des. Antônio Rigolin, j. em 05/11/2013). Prestação de serviços. Publicidade em lista telefônica e internet - Ação de nulidade de título de crédito c/c indenização. Ação improcedente. Instrumento contratual impreciso. Desídia da contratante ao firmar o contrato. Serviço efetivamente prestado. Contraprestação devida. Decisão mantida. Apelação não provida. (TJSP, 10ª Câmara Extraordinária de Direito Privado, Apelação com revisão n. 0180430-21.2012.8.26.0100, Rel. Des. Luiz Eurico, j. em 22/09/2014). Procede, no entanto, a insurgência da autora quanto ao tempo do contrato firmado, “ora por tempo indeterminado, e por períodos de 36 meses”, na medida em que tal disposição se mostra abusiva ao não dispor de qualquer forma de rescisão, condicionando a parte contratante, sem alternativa, ao pagamento de uma multa de 40% sobre o valor do contrato caso isso venha a ocorrer. Deveras, tal pactuação se mostra leonina, restringindo o direito da parte contratante no exercício regular de um direito, que é de não ficar atrelado indefinidamente a um contrato. Ademais, em que pesem os argumentos de sustentação de defesa, se observa que a despeito da comprovação do anúncio contratado, tal não se fez em relação ao ano de 2018, de forma que, interposta a ação em 17/01/2018, é de se reconhecer como exigível unicamente o valor relativo ao primeiro ano de contratação, qual seja, de 2017, pelo montante de R4. 2520,00, com o direito de rescisão do contrato pela autora, sem o pagamento de qualquer multa, mesmo porque, não demonstrada a existência por parte da requerida, de qualquer prejuízo a justificar a imposição da multa. Embora tenha havido divergência em relação ao que é pedido pela requerida e o que realmente é devido, se tem que a cobrança, por si só, não ultrapassa às raias de meros contratempos, de forma em não se afigurar a existência de dano moral indenizável. Ante o exposto, revogo a liminar anteriormente concedida e","CONCLUSÃO Em 28/03/2019, faço estes autos conclusos ao MM. Juiz de Direito da 7ª Vara Cível de Campinas, Dr. Celso Alves de Rezende. Eu, Elvio Soriano Leme, Coordenador, M360471. SENTENÇA Processo nº: 1001137-22.2018.8.26.0114 Classe – Assunto: Procedimento Comum Cível - Práticas Abusivas Requerente: Mercadante & Cardoso Ltda Me Requerido: A R de Araújo Comunicações Me- Guia Mais Plus Juiz de Direito: Dr. Celso Alves de Rezende Vistos. Considerando a satisfação da obrigação,",". A natureza da matéria questionada autoriza o julgamento antecipado da lide, nos termos do artigo 355, inciso I, do CPC, eis que diante das alegações expendidas e documentos apresentados, prescinde-se da produção de outras provas. Como é cediço, o juiz é o destinatário final da prova, incumbindo-lhe decidir sobre a necessidade, ou não, de dilação probatória, ou julgar antecipadamente a lide. Compete ao juiz, na condução do processo, deferir e apreciar o arcabouço probatório coligido. Entendendo que as provas constantes dos autos são suficientes para a formação de seu convencimento para o deslinde da questão, não se configura cerceamento de defesa. Nesse sentido, prevê o art. 370 do CPC: “Caberá ao juiz, de ofício ou a requerimento da parte, determinar as provas necessárias ao julgamento do mérito”. Ademais, o Supremo Tribunal Federal já há muito se posicionou no sentido de que a necessidade de produção de prova em audiência há de ficar evidenciada para que o julgamento antecipado da lide implique em cerceamento de defesa. A antecipação é legítima se os aspectos decisivos da causa estão suficientemente líquidos para embasar o convencimento do magistrado (RTJ 115/789). A exceção de incompetência suscitada em contestação não comporta acolhida. O caso versado nos autos permite concluir que a parte requerente se amolda ao conceito de destinatária final e, portanto, consumidora, na medida em que os serviços oferecidos não se inserem na cadeia produtiva. Nesse sentido: “APELAÇÃO - Ação declaratória - Duplicata sacada em razão de serviço de inserção de publicidade em lista telefônica Pedido procedente - Pleito de reforma - Impossibilidade - Relação de consumo configurada - Parte autora que é destinatária final da publicidade - Serviço não inserido na cadeia produtiva Ausência de transformação (inteligência do art. 2º, caput, do Código de Defesa do Consumidor) - Contrato subscrito por suposto funcionário, sem poderes de representação - Boa-fé que é de ser observada a partir da constituição do contrato até a efetiva conclusão - Teoria da aparência que não se aplica à hipótese - Inexistência de lastro à emissão do título - Duplicata inexigível - Sentença mantida Recurso improvido.” (TJSP; 19ª Câmara de Direito Privado; Apelação Cível nº 1082735-40.2018.8.26.0100; Relª. Cláudia Grieco Tabosa Pessoa; j.09/04/2019; DJE 23/04/2019). (Destaquei) Aliás, a natureza da autora, pessoa jurídica, não exclui, por si só, eventual condição de consumidora. Logo, tratando-se de relação de consumo, o domicílio a ser observado é o da consumidora, a teor do art. 101, inciso I, do CDC, permitindo o ajuizamento da presente ação nesta Comarca de Marília/SP, ficando, rejeitada, por conseguinte, a exceção de incompetência territorial. Não havendo outras preliminares, presentes os pressupostos processuais e as condições da ação, passa-se ao exame do mérito. Cuida-se de ação de rescisão contratual cumulada com pedidos de indenizações por danos morais e danos materiais. A ação é parcialmente procedente. Na hipótese versada, verifica-se, primeiramente, que o contrato objeto da ação foi firmado por pessoas capazes, em formato não defeso em lei, versando sobre objeto lícito e determinado. A propósito, a parte autora, em sua petição inicial, sequer impugna a relação jurídica travada entre as partes, admitindo que anuiu com contrato de prestação de serviço oferecido pela parte ré (vide fls. 22). Sustenta, no entanto, que não foi devidamente informada acerca da forma de prestação do serviço adquirido, tampouco quanto aos valores cobrados, haja vista que teria sido comunicada por representante da requerida, quando da realização do negócio, que o serviço adquirido consistia na divulgação de anúncio em lista telefônica convencional, no formato físico, a ser pago mediante parcela única no valor de R$ 210,00 (duzentos e dez reais). Alega, a este respeito, que, ao contrário do informado, o serviço foi prestado na modalidade digital, por meio de endereço eletrônico na internet, sendo cobrado não apenas uma parcela de R$ 210,00 (duzentos e dez reais), mas 36 (trinta e seis) prestações nesta mesma quantia, totalizando a importância de R$ 7.560,00 (sete mil quinhentos e sessenta reais). No que tange à alegação de que o serviço contratado foi prestado de forma diversa da informada, tem-se que não encontra respaldo nos elementos probatórios contidos nos autos. Da simples leitura do contrato firmado entres as partes, conforme fls. 22, ao qual a parte requerente teve pleno acesso antes da sua assinatura, conforme confessado às fls. 03, extrai-se que o serviço pactuado consistia na criação e divulgação de anúncio da empresa requerente por meio do site Guiaplus. Nota-se, ainda, não haver qualquer menção no pacto de que o serviço de divulgação seria na forma defendida pela parte requerente, ou seja, em lista telefônica no formato físico. Neste passo, cai por terra a alegação da requerente de que houve falha no dever de informação da requerida, no que tange à forma da prestação do serviço adquirido, haja vista que, conforme acima delineado, o instrumento contratual de fls. 22 é suficientemente claro quanto às obrigações assumidas pela requerida (criação e divulgação de anúncio por meio de website), cujo cumprimento sequer é questionado pela autora, haja vista a informação de que o serviço fora prestado na forma indicada no pacto (fls. 42). Assim sendo, o negócio jurídico objeto desta ação é válido e está apto à produção dos efeitos jurídicos que lhe são próprios. Por outro lado, em que pese a higidez do contrato, tem-se que a cobrança de quaisquer valores além de 12 (doze) parcelas, no valor de R$ 210,00 (duzentos e dez reais), representa ilegalidade contratual passível de restituição à parte autora. Isto porque, ao contrário do alegado pela requerida, da simples observação do contrato não é possível aferir que 36 (trinta e seis) seria o número de parcelas a serem pagas pela parte demandante em razão da pactuação do negócio. Pelo contrário; ainda que do pacto fique evidenciado a sua forma parcelada, vide o “X” assinalado na lacuna que indica a informação “parcelado” (quadro central no lado esquerdo do contrato), e a fixação do valor das parcelas na quantia mensal de R$ 210,00 (duzentos e dez reais), haja vista a expressa menção neste sentido (quadro central no lado direito do contrato), extrai-se que somente \"12\" (doze) seriam as prestações a serem pagas, conforme indica o contrato (quadro central, lado esquerdo, a direita do “X” no campo “parcelado”) (fls. 22). Por sua vez, na parte inferior do contrato, embora exista informação acerca da vigência do contrato, não há nenhuma informação clara de que o pagamento de 12 parcelas no valor de R$ 210,00 seria referente a cada ano de serviço, conforme quer fazer crer a requerida, o que totalizaria, assim, 36 (trinta e seis) parcelas. Aliás, dar credibilidade a esta versão sustentada pela parte requerida seria ir contra ao estampado no artigo 6.º, inciso III, do CDC, o qual determina que seja dispensado ao consumidor informação clara e adequada acerca do serviço contratado, inclusive, quanto ao preço cobrado. Não se olvida, ainda, que dentre as disposições fundamentais do Código de Defesa do Consumidor está aquela que impõe a interpretação mais favorável ao consumidor, nos termos do artigo 47 da legislação consumerista. Assim sendo, conforme acima delineado, fica o requerente obrigado a honrar com o pagamento de apenas 12 (doze) parcelas mensais, todas no valor de R$ 210,00 (duzentos e dez reais), não podendo o requerido, por conseguinte, pelo contrato firmado (n.º 17.648), cobrar qualquer valor que vá além deste número de prestações. Ademais, na hipótese versada, é fato incontroverso que a parte autora, pela contratação do serviço prestado pela ré, efetuou o pagamento das parcelas referente aos meses de outubro de 2017 a outubro de 2018, haja vista que tal fato, sustentado às fls. 42, sequer foi impugnado pela parte requerida em contestação, presumindo-se, nos termos do art. 341 do Código de Processo Civil, a veracidade desta assertiva. Extrai-se, portanto, que 13 (treze) foram às parcelas adimplidas pela parte requerente. Neste passo, existindo a informação prestada pela própria requerida de que as parcelas contratuais seriam no valor de R$ 210,00, circunstância esta confirmada pelo contrato de fls. 22, e, nos termos acima explanados, havendo a obrigação contratual da parte requerente em pagar apenas 12 (doze) prestações, evidenciado está o dano material da parte autora, haja vista o pagamento de uma parcela além do estipulado. De rigor, assim, que a parte demandada seja condenada a restituir à parte demandante o valor adimplido pelo pagamento desta (R$ 210,00). Por conseguinte, havendo o pleno cumprimento das obrigações contratuais pela parte consumidora, haja vista ser incontroverso nos autos o pagamento das parcelas referente ao negócio jurídico em questão, conforme supracitado, fica a parte requerida impedida de incluir o nome da parte requerente em cadastro de inadimplentes, bem como protesta-lá em cartório, por qualquer débito oriundo do contrato em questão (n.º 17.648 fls. 22). Por fim, não há que se falar em dano moral indenizável, uma vez que os fatos narrados na inicial não caracterizam tal tipo de dano, eis que não se vislumbra uma diminuição no sentimento de autoestima do autor, mas mero aborrecimento, tampouco mácula a reputação ou a imagem da empresa requerente. Ante o exposto,",null,". O feito em questão comporta o julgamento antecipado, nos termos do art. 355, I, do CPC, haja vista que a questão controvertida nos autos é meramente de direito, mostrando-se, por outro lado, suficiente a prova documental produzida. Trata-se de ação declaratória objetivando o reconhecimento da inexigibilidade do título (duplicata mercantil por indicação), com o consequente cancelamento do protesto perante 2º Tabelião de Notas e Protesto de Pirassununga (fls.15). Afasto a preliminar de incompetência territorial tendo em vista que o protesto foi levado a efeito nesta comarca. O autor nega qualquer relação com a requerido, alegando que o título não seria devido. Por sua vez, a requerida alega que a duplicata foi emitida em decorrência do contratao juntado a fls. 49/50 que comprova a relação jurídica estabelecida entre as partes, A controvérsia gira em torno da exigibilidade da dívida e da regularidade do protesto efetuado em desfavor do autor. E, neste ponto, a duplicata protestada deve ser considerada indevida. A duplicata mercantil é título de crédito causal, extraído por vendedor, ou prestador de serviços, que visa documentar o saque fundado sobre crédito decorrente de compra e venda mercantil ou prestação de serviços, assemelhada aos títulos cambiários por lei, e que tem como seu pressuposto a extração da fatura (art. 1º, da Lei nº 5.474/68). Portanto, por ser título de crédito causal, sua validade depende da existência de relação jurídica subjacente, que justifique sua emissão. Não havendo o aceite, deve se concretizar com a apresentação de documento que comprove a efetiva entrega e o efetivo recebimento da mercadoria ou prestação do serviço. Logo, a causalidade do título somente se faz presente quando há a efetiva entrega da mercadoria ou prestação do serviço sem o qual se trata de título inexistente, consequentemente inexigível e sem o qual não se produzirá qualquer efeito o sacado diante da inexistência da relação comercial subjacente. No caso, a ré apresentou contestação extremamente genérica, não logrando êxito comprovar fato impeditivo, modificativo ou extintivo do direito do autor, ônus que lhe cabia (art. 373, II, CPC). Com efeito, os elementos dos autos não comprovam nem mesmo qual seria a relação jurídica existente entre as partes já que o documento de fls. 51 está ilegível. Ainda, não há comprovação da efetiva prestação de serviços. Sobre o tema: APELAÇÃO CÍVEL. AÇÃO MONITÓRIA. DUPLICATA SEM ACEITE. ENTREGA DE MERCADORIA E PRESTAÇÃO DE SERVIÇOS . AUSÊNCIA DE COMPROVAÇÃO. Sentença de improcedência do pedido monitório. Inconformismo. AUSÊNCIA DE COMPROVAÇÃO DA EXISTÊNCIA DO NEGÓCIO JURÍDICO SUBJACENTE. Necessidade de juntada de comprovante de entrega e recebimento de mercadorias para a cobrança judicial da duplicata não aceita. Inteligência do art. 15 da Lei nº 5.474/68 e do art . 11 do Provimento nº 30/97, com a nova redação ao Capítulo XV, Tomo II das Normas de Serviços da Corregedoria Geral da Justiça. No caso concreto, a ação foi instruída apenas com cópia da duplicata, do DANFE e da nota fiscal de serviços, todos sem assinatura do recebedor. Ausência de comprovação da entrega dos produtos e da prestação dos serviços descritos. Ônus da prova correspondente incumbia à apelante (art . 373, inc. I, do CPC) que disso não se desincumbiu, sob pena de imposição da chamada prova diabólica à embargante, que alegou que não manteve a aludida relação comercial com a requerente. Improcedência do pedido monitório. Sentença mantida . RECURSO DESPROVIDO. (TJ-SP - AC: 10489383120188260114 SP 1048938-31.2018.8 .26.0114, Relator.: Rodolfo Pellizari, Data de Julgamento: 02/09/2022, 24ª Câmara de Direito Privado, Data de Publicação: 02/09/2022). Registre-se que não há nos autos outra prova documental, como mensagens ou ligações telefônicas que evidenciem a realização do negócio jurídico entre as partes. Por essa razão, a declaração de inexigibilidade do débito é de rigor. Por fim, deixo de condenar a requerida nas penas de litigância de má-fé já que não houve tentativa de ludibriar o juízo mas tão somente interpretação divergente. Diante do quanto exposto,",". O feito em questão comporta o julgamento antecipado, nos termos do art. 355, I, do CPC, haja vista que a questão controvertida nos autos é meramente de direito, mostrando-se, por outro lado, suficiente a prova documental produzida. Trata-se de ação declaratória objetivando o reconhecimento da inexigibilidade do título (duplicata mercantil por indicação), com o consequente cancelamento do protesto perante 2º Tabelião de Notas e Protesto de Pirassununga (fls.15). Afasto a preliminar de incompetência territorial tendo em vista que o protesto foi levado a efeito nesta comarca. O autor nega qualquer relação com a requerido, alegando que o título não seria devido. Por sua vez, a requerida alega que a duplicata foi emitida em decorrência do contratao juntado a fls. 49/50 que comprova a relação jurídica estabelecida entre as partes, A controvérsia gira em torno da exigibilidade da dívida e da regularidade do protesto efetuado em desfavor do autor. E, neste ponto, a duplicata protesta ção foi instruída apenas com cópia da duplicata, do DANFE e da nota fiscal de serviços, todos sem assinatura do recebedor. Ausência de comprovação da entrega dos produtos e da prestação dos serviços descritos. Ônus da prova correspondente incumbia à apelante (art . 373, inc. I, do CPC) que disso não se desincumbiu, sob pena de imposição da chamada prova diabólica à embargante, que alegou que não manteve a aludida relação comercial com a requerente. Improcedência do pedido monitório. Sentença mantida . RECURSO DESPROVIDO. (TJ-SP - AC: 10489383120188260114 SP 1048938-31.2018.8 .26.0114, Relator.: Rodolfo Pellizari, Data de Julgamento: 02/09/2022, 24ª Câmara de Direito Privado, Data de Publicação: 02/09/2022). Registre-se que não há nos autos outra prova documental, como mensagens ou ligações telefônicas que evidenciem a realização do negócio jurídico entre as partes. Por essa razão, a declaração de inexigibilidade do débito é de rigor. Por fim, deixo de condenar a requerida nas penas de litigância de má-fé já que não houve tentativa de ludibriar o juízo mas tão somente interpretação divergente. Diante do quanto exposto,",". Ilegitimidade ativa Sobre legitimidade da parte, é da lição de Marcus Vinicius Rios Gonçalves ser a “relação de pertinência subjetiva entre o conflito trazido a juízo e a qualidade para litigar a respeito dele, como demandante ou demandado. Tem de haver uma correspondência lógica entre a causa posta em discussão e a qualidade para estar em juízo litigando sobre ela. A legitimidade deve existir tanto para o autor quanto para o réu, sob pena de carência da ação, pois ninguém pode ir a juízo, em nome próprio, postular ou defender direito alheio (CPC, art. 6º). Não se pode admitir, salvo excepcionalmente, que alguém vá a juízo, na condição de parte, para postular ou defender interesse que é atribuído a outra pessoa” (in Novo curso de direito processual civil, volume 1: teoria geral e processo de conhecimento (1ª parte). 7.ed. São Paulo: Saraiva, 2010). Assim, possuem legitimidade para configurar numa lide aquele que diz ser titular de um direito (legitimidade ativa) e aquele contra quem o autor afirma que o direito deve ser exercido (legitimidade passiva). A veracidade das alegações e a procedência ou não das razões jurídicas alegadas não se inserem no exame das condições da ação e da legitimidade de parte, por conseguinte. Desta forma, quaisquer considerações a respeito da autoria dos fatos, da insuficiência das provas ou da ausência de responsabilidade, ainda que procedentes, não devem ser analisadas como matérias preliminares, mas no mérito da ação. No presente caso, as pretensões são da empresa Control Terra Transportes e Terraplanagem LTDA, a qual é apenas representada pelo sócio Gilson Teixeira Pires, como se extrai da inicial, o qual, por equívoco, foi incluído no cadastro processual, mas não como autor na inicial. Por isso, descabe falar na ilegitimidade de Gilson para figurar no polo ativo da demanda, visto que não integra a lide, razão pela qual afasto a preliminar de ilegitimidade e faço a baixa de seu nome no cadastro processual. Mérito É caso de julgamento antecipado do pedido, nos termos do art. 355, I, do CPC, tendo em vista que os fatos determinantes à resolução da lide já estão demonstrados nos autos, dispensando-se a dilação probatória. Trata-se de ação declaratória cumulada com indenização por danos morais, por meio da qual a autora requer o decreto de inexistência de relação jurídica com a ré, bem como de nulidade do contrato objeto de protesto, sob argumento de desconhecimento do contrato e da pessoa que o assinou, versão que não se sustenta, ante às provas colacionadas aos autos. Com efeito, os documentos de fls. 73/74 demonstram que o sócio Gilson Teixeira Pires solicitou à ré o encaminhamento da segunda via dos boletos referentes aos meses de janeiro e fevereiro, manifestando ainda sua ciência quanto à obrigação de pagamento dos demais boletos no valor de R$ 290,00, conforme consta no contrato de fls. 69/70. Assim, não se pode admitir que a autora desconheça quem assinou o contrato de fls. 69/70, visto que revela ter conhecimento dos termos daquele. Ademais, a pessoa que celebrou o contrato encaminhou o termo devidamente preenchido mediante whatsapp com o logo da empresa (fls. 72), apresentando-se como “gerente/secretário” daquele. A par disso, vale observar ainda que o serviço contratado foi devidamente prestado pela ré (fls. 76). Por isso, ainda que assinado por mero funcionário da empresa e não por seu sócio, o contrato de fls. 69/70 deve prevalecer, em virtude da teoria da aparência, a qual prestigia a boa-fé da empresa contratada que supõe estar negociando com representante legal ou administrador da empresa que detém poderes para tanto. Ante a regularidade da contratação, a improcedência da demanda é medida que se impõe. Litigância de má-fé Por fim, observo que a parte autora alegou desconhecer a origem da dívida que gerou a negativação, porém o e-mail de fls. 73 revela que conhecia sim à época da propositura da ação a origem da cobrança, o que configura alteração da verdade dos fatos. O comportamento da parte autora configura litigância de má-fé e deve implicar apenação, na forma prevista no art. 77, I, que obriga expor os fatos em juízo conforme a verdade, e do art. 80 do CPC, segundo qual, reputa-se litigante de má-fé aquele que alterar a verdade dos fatos (II), o que autoriza a imposição da multa prevista no art. 81 do CPC. Há uma medida nas coisas e todas elas têm um limite. A parte autora objetivava o decreto de nulidade do negócio e ainda obter indenização indevida, acreditando que a ré não se desincumbiria do ônus de comprovar a legitimidade do débito. Para tanto, utilizou-se do Poder Judiciário, fazendo com que tempo e recursos públicos fossem usados para atingir sua finalidade ilegal, implicando clara e indiscutível litigância de má fé. Deve a parte incidente em tal conduta responder com as cominações legais. Pelo exposto, CONDENO a parte autora ao pagamento ao réu de multa de 10% do valor da causa atualizado (art. 81, §2º, do CPC), em razão da litigância de má-fé (art. 80, II, e 81, do CPC), e de indenização dos prejuízos a parte ré que sofreu, em montante a ser apurado em fase de liquidação (art. 81, §3º), valores que deverão ser pagos independentemente da gratuidade de justiça. Dispositivo Em face do exposto, JULGO IMPROCEDENTES o(s) pedido(s) contidos na inicial.",". Ilegitimidade ativa Sobre legitimidade da parte, é da lição de Marcus Vinicius Rios Gonçalves ser a “relação de pertinência subjetiva entre o conflito trazido a juízo e a qualidade para litigar a respeito dele, como demandante ou demandado. Tem de haver uma correspondência lógica entre a causa posta em discussão e a qualidade para estar em juízo litigando sobre ela. A legitimidade deve existir tanto para o autor quanto para o réu, sob pena de carência da ação, pois ninguém pode ir a juízo, em nome próprio, postular ou defender direito alheio (CPC, art. 6º). Não se pode admitir, salvo excepcionalmente, que alguém vá a juízo, na condição de parte, para postular ou defender interesse que é atribuído a outra pessoa” (in Novo curso de direito processual civil, volume 1: teoria geral e processo de conhecimento (1ª parte). 7.ed. São Paulo: Saraiva, 2010). Assim, possuem legitimidade para configurar numa lide aquele que diz ser titular de um direito (legitimidade ativa) e aquele contra quem o autor afirma que o direito deve ser exercido (legitimidade passiva). A veracidade das alegações e a procedência ou não das razões jurídicas alegadas não se inserem no exame das condições da ação e da legitimidade de parte, por conseguinte. Desta forma, quaisquer considerações a respeito da autoria dos fatos, da insuficiência das provas ou da ausência de responsabilidade, ainda que procedentes, não devem ser analisadas como matérias preliminares, mas no mérito da ação. No presente caso, as pretensões são da empresa Control Terra Transportes e Terrapl ficientes\" para arcar com as custas do processo sem sacrifício próprio ou de seus dependentes, nada trouxe aos autos para corroborar tais premissas, nem da pessoa física, nem da empresa individual, cujos patrimônios confundem-se. O pedido comporta julgamento antecipado, nos termos do artigo 355, inciso I, do Código de Processo Civil, por ser a questão exclusivamente de direito e a prova documental. De plano, cumpre frisar que se tem por aplicável ao caso em apreço as disposições do Código de Defesa do Consumidor, pois o autor figura como destinatário final dos serviços prestados. De fato, houve contratação de anúncio na internet, considerado como serviço de publicidade, visando à satisfação da necessidade direta e não para fornecê-lo a terceiros. Afasto a preliminar de incompetência territorial suscitada pela ré, na medida em que a parte autora, na qualidade de consumidora, pode propor a presente demanda em seu domicílio, não subsistindo (cláusula nula) a cláusula de eleição de foro no presente caso, até porque dificulta a defesa do consumidor em juízo. No mérito o pedido é parcialmente procedente. O autor pretende a declaração da rescisão de contrato de publicidade, sem qualquer ônus, sob a alegação de que fora indevidamente celebrado pelo prazo de trinta e seis meses, quando acreditava ser por apenas 12 meses. Segundo narrou, após adquirir os serviços por 12 parcelas de R$ 290,00, insatisfeito, solicitou a rescisão, vindo a efetuar o pagamento de R$ 1.392,00 a título de multa, acreditando ter, à época, cumprido com suas obrigações. No entanto, surpreendido com a informação da vigência total do contrato pelo prazo de 36 meses, mediante renovação automática, e com a ameaça de inscrição negativa de seu nome, o requerente efetuou novo pagamento de R$ 4.000,00 a título de cláusula penal, valor este que pretende reaver. A ré, por sua vez, defendeu que o contrato abrangia 03 edições, de forma o pagamento devido perfazia, na verdade, 36 parcelas mensais de R$ 290,00. Aduz, assim, que o primeiro distrato assinado pelo autor referia-se a primeira edição e que as partes chegaram a um acordo para pagamento dos R$ 4.00,00 para rescisão. Tal se reputa evidentemente abusivo, pois o documento de fls. 69 não faz alusão clara e inequívoca ao valor total da contratação em tais termos, o que seria essencial em situações dessa natureza, de forma que não seria observado um dos direitos básicos do consumidor previsto no art. 6º do CDC, qual seja o da “informação adequada e clara sobre os diferentes produtos e serviços, com especificação correta de quantidade, características, composição, qualidade e preço, bem como sobre os riscos que apresentem”. Tal como redigido, referido documento propicia interpretação dúbia, na medida em que há apenas a especificação do \"valor mensal por extenso\", ao lado do número 12 e da opção \"parcelado\". Apesar de constar que o contrato \"tem prazo indeterminado, com vigência por períodos sucessivos de 36 (trinta e seis meses)\", é perfeitamente válido inferir que o serviço corresponderia a 12 parcelas de R$ 290,00 para sua integral prestação, ao longo dos 36 meses durante os quais vigeria, não ficando seguramente elucidado o fato de que as prestações pecuniárias se estenderiam por esse mesmo interim. O fato de o requerente ter elaborado novo distrato, mediante o pagamento de R$ 4.000,00 não tem o condão de confirmar que sabia dos exatos termos contratuais, sendo plenamente crível, diante do pagamento anterior, que o fez apenas como forma de se evitarem medidas restritivas por parte da ré. Não bastasse, a despeito da demonstração do anúncio confeccionado, não se vislumbra justificativa para o valor da cláusula penal em tal montante, sobretudo se considerado o distrato anterior, o que, por si só, já valeria como forma de ressarcir a ré de eventuais despesas administrativas, conforme art. 413, do Código Civil e art. 51, inciso III, do Código de Defesa do Consumidor. De rigor, assim, que o contrato seja rescindido desde o primeiro distrato. Não se acolhe, por fim, o pedido de indenização por danos morais, vez que ausentes qualquer lesão ao bom nome da empresa individual, que sequer fora negativado, tal como explicitado. Diante do exposto,","SENTENÇA Processo nº: 1004616-32.2019.8.26.0132 Classe - Assunto Procedimento do Juizado Especial Cível - Rescisão do contrato e devolução do dinheiro Requerente: Marcio Jose Marchioli Me Requerido: A R de Araújo Comunicações - Me (Guia Plus Comunicações) Juiz(a) de Direito: Dr(a). MARIO YAMADA FILHO Vistos. Trata-se de ação Procedimento do Juizado Especial Cível ajuizada por Marcio Jose Marchioli Me em face de A R de Araújo Comunicações - Me (Guia Plus Comunicações). A requerida interpôs recurso à sentença de fls. 86/88, tendo o V. Acórdão negado provimento ao recurso da parte requerida, mantendo a sentença pelas razões já expostas na fundamentação, impondo à parte recorrente, vencida, o pagamento das custas e honorários advocatícios, fixados em 10 % (dez por cento) do valor da condenação. Após, a requerida propôs o parcelamento da dívida em 04 prestações, tendo a parte autora concordado com a proposta de acordo, requerente a homologação e o levantamento do valor já depositado. Diante o exposto, homologo o acordo apresentado a fls. 127, para que surta seus legais e jurídicos efeitos e",". A matéria dos autos é exclusiva de direito, de modo que se passa diretamente ao julgamento da lide, nos termos do artigo 355, I, do CPC. Trata-se de ação declaratória em que a Autora alega não ter contratado os serviços da Ré e, por isso, nada seria devido a ela. A Ré bate-se na correção da contratação e, em decorrência, da cobrança pelo serviço prestado. A questão de fundo é saber se houve ou não a contratação contra a qual se insurge a Autora. Na ótica deste Juízo não houve. Isso porque se trata de negócio que exige, minimamente, o cumprimento de formalidade prevista no artigo 104 do Código Civil. A Ré já é habitual ocupante do polo passivo de ações como a presente, dado o seu pitoresco modo de agir. Apresenta-se um documento aparentemente sem vinculação à parte e colhe-se a sua assinatura, seja lá de quem for. Passado algum tempo, chega a conta pelos supostos serviços prestados. Ora qualquer negociação , como dito acima, demanda um mínimo de formalidade. E, em se tratando de pessoa jurídica, no mínimo, deve-se negociar com quem tem poderes para tanto. O agente deve, no caso da pessoa jurídica, não somente ser capaz, como também ter poderes para agir em seu nome. Inválida a alegação da chamada \"teoria da aparência\", dadas as circunstancias que o negócio teria se realizado, ou seja, por meio de telefonema ( feito sempre pela própria Ré). Não foi, portanto, a Autora que procurou a Ré e sim o oposto. Custa mesmo ao Juízo acreditar que a contratação tenha sido feita de modo tão superficial. O documento de fls. 73/76, de fato, não prova a contratação, mesmo porque subscrito por quem não se sabe se tem poderes para agir em nome de pessoa jurídica. E, pouco importa se era mesmo, dado que a vontade da Autora foi viciada pela condição exuberante da contratação telefônica montada pela Ré. Ao que parece, a Ré, quando faz suas contratações, ou desconhece ou finge desconhecer o teor do disposto no artigo 422 do Código Civil Brasileiro. Só por isso, a ação já é procedente. Entrementes, há mais. O contrato (como tantos outros da Ré já reconhecidos em Juízo), pois, formalmente, não contou com a anuência da Autora ( na pessoa de quem a representasse). É nítido que a Autora foi engodada. Há mais ainda. Ao caso ( respeitado o entendimento esposado a fls. 93/94) aplicam-se as disposições da Lei Federal 8.078/90 ( ainda que por equiparação), sendo que cabia à Ré a prova da correção de sua conduta. Isso ela não provou. É incrível que a Ré alegue a correção de sua conduta se, desde a gênese, a contratação já se mostrava, no mínimo, anulável. Havendo ( também) relação de consumo, a Ré, como fornecedora deveria conhecer os deveres estampados nos artigos 51 e 54 do chamado Código de Defesa do Consumidor. É certo, portanto, que a vontade da Autora foi, nitidamente, eivada de vício, pois o preposto da Ré, agindo, quiçá como títere, apenas induziu a erro a primeira pessoa que o atendeu ao telefone ( o que foi feito pelo menos duas vezes). E, quanto ao dano moral, este ocorreu. Dada a permissão do verbete 227 da súmula do STJ e também pelo aborrecimento a que a Autora foi submetida. Primeiro por ser vítima de uma fraude. Depois porque, como se vê dos autos, a Autora tentou diversas vezes desfazer o infausto negócio, todas sem êxito algum. Verdade que o nome da Autora não chegou a ser maculado, ante a intervenção do Poder Judiciário no caso. Entrementes, a situação passou dos limites do enfado do dia a dia, pois, ante uma contratação nula, a Autora se viu obrigada a resolver um problema que não causara. E, com espeque no artigo 944 do Código Civil, este Juízo entende que o valor de R$ 5.000,00 é mais que suficiente para compensar a Autora pela ignomínia causada pela Ré. Daí, a procedência do pedido contido na inicial. Pelo exposto,",null,"Impõe-se o julgamento conforme o estado do processo, como faculta o artigo 355, inciso I do Código de Processo Civil. Afasto a preliminar de incompetência territorial, pois a presente ação versa sobre um contrato de prestação de serviços, tratando-se de relação de consumo. Portanto, este juízo é competente nos termos do artigo 101, inciso I, do Código de Defesa do Consumidor. O pedido procede em parte. A autora pleiteia que seja declarada a nulidade do contrato de prestação de serviços firmado com a requerida (fls. 33). O representante da autora alega que foi induzido a erro, pois mediante contato telefônico um representante da requerida disse que o serviço era gratuito. Não assiste razão à autora. As alegações do representante da autora que foi induzido a erro pela requerida e que o serviço seria prestado de maneira gratuita não encontram respaldo nas provas trazidas as autos. O contrato encontra-se assinado pelo representante da autora e indica claramente de que o serviço seria oneroso. Não há abusividade contratual a ser reconhecida. Não há valor a ser ressarcido. Tendo em vista que a autora vem depositando judicialmente as parcelas do contrato, declaro rescindido o contrato firmado entre as partes a partir desta data, devendo a ré providenciar a baixa no sistema do contrato e de eventual débito existente. Daí a parcial procedência do pedido. Posto isto, nos termos do artigo 487, inciso I, do Código de Processo Civil",null,". É caso de imediato julgamento do mérito, porquanto os elementos amealhados se mostram suficientes para o deslinde do litígio. Inicialmente, registre-se que, tal como consignado no v. acórdão de fls. 215/223, não são aplicáveis as disposições do Código de Defesa do Consumidor ao caso em questão, haja vista que o serviço prestado pela requerida foi contratado para implementação de atividade comercial da requerente, não restando demonstrada qualquer vulnerabilidade, seja técnica, jurídica ou econômica em relação à requerida. Neste contexto, a intervenção judicial na dinâmica das relações privadas é excepcional, e, a teor de dispositivos como o artigo 421, parágrafo único, e o artigo 421-A, ambos do Código Civil, somente cabível quando houver afronta aos princípios e normas de ordem pública e natureza cogente, com a finalidade de adequar o contrato à sua função social. No caso, pretende o autor a declaração de inexigibilidade dos débitos cobrados posteriormente ao encaminhamento à ré de notificação na qual exteriorizou seu desinteresse em dar continuidade à relação contratual até então mantida (fls. 37/40), além do recebimento de indenização por danos morais, em razão do indevido protesto de título em seu nome. Com efeito, a despeito do quanto alegado na peça defensiva, restou suficientemente demonstrado nos autos que o requerente encaminhou notificação ao endereço constante do instrumento firmado entre as partes (fl. 167), solicitando a resilição contratual, sendo certo que a comunicação foi recebida no dia 27 de setembro de 2019 (fl. 38). Como cediço, ninguém pode ser obrigado a manter vínculo contratual com outrem caso assim não o deseje, cumprindo, na questão, apenas analisar se incide eventual penalidade para o caso de rescisão antecipada do vínculo. Todavia., observo que o instrumento de fl. 127 é eivado de dubiedades no tocante ao prazo de vigência e penalidades a serem aplicadas. No que tange ao prazo do contrato, observa-se a existência de estipulações contraditórias, pois, ao passo em que prevê “prazo indeterminado” para a contratação o que sequer é admitido pelo ordenamento pátrio, à luz do artigo 598 do Código Civil , prevê que a vigência se dará “por períodos sucessivos de 36 (trinta e seis) meses, a partir da data da sua assinatura, relativos a 3 (três) edições” (fl. 167). Além disso, no que tange à possibilidade de “cancelamento”, o contrato estipulou o prazo de 7 dias, a contar de sua assinatura, sem incidência de penalidades, ou, decorrido tal período, o contrato poderia ser “cancelado” no prazo de 23 dias, hipótese na qual haveria incidência de multa de 40% do valor pactuado. Ocorre que o autor não solicitou o cancelamento no prazo de 7 dias da assinatura, tampouco nos 23 dias subsequentes (período em que haveria incidência de multa). Passado tal prazo, não se observa a vedação da resilição contratual ou qualquer incidência de multa. Nessa senda, por qualquer lado que se analise a questão, não faz jus a requerida ao recebimento de qualquer valor a título de multa contratual, de maneira que os protestos dos títulos foram indevidos, razão pela qual de rigor a declaração de inexigibilidade das dívidas neles corporificadas, com o consequente cancelamento definitivos dos protestos e a consolidação da tutela antecipada deferida. No mais, no que tange à pretensão indenizatória, os protestos indevidos, em si, promovidos por iniciativa da ré e suficientemente comprovados pelos documentos de fls. 42/44, são em princípio suficientes para autorizar o reconhecimento de prejuízo juridicamente relevante, de natureza extrapatrimonial, tendo em vista o presumido abalo da imagem e honra objetiva das vítimas perante o mercado, com reflexos sobre o crédito e atos diversos do cotidiano, o que é pacificamente reconhecido pela jurisprudência e dispensa maior aprofundamento: “A jurisprudência do Superior Tribunal de Justiça é no sentido de que, na hipótese de protesto indevido de título ou de inscrição irregular em cadastros de inadimplentes, o dano moral se configura in re ipsa - independentemente de prova” (AgInt. no AREsp. nº 1.679.481/MS, 4ª Turma, rel. Min. Antônio Carlos Ferreira, j. 28/9/20, DJe 1º/10/20). No que diz respeito ao valor, a indenização por dano moral, segundo reza a jurisprudência do E. Superior Tribunal de Justiça, “conserva a sua função pedagógico-punitiva de desestimular o ofensor a repetir a falta” (AgInt. no AREsp. nº 862.868/CE, 3ª Turma, Rel. Min. Moura Ribeiro, j. 16/6/16), o que também encontra respaldo em precedentes do C. Supremo Tribunal Federal (e.g., AgRg. no ARE nº 721.793, 1ª Turma, Rel. Min. Luiz Fux, j. 23/4/13). Atento a essas circunstâncias, tenho por adequado e suficiente o montante de R$ 5.000,00 (cinco mil reais) para a reparação. O montante em questão deve ser atualizado a partir desta data, nos termos do enunciado da Súmula 362 do E. Superior Tribunal de Justiça, e acrescido de juros de mora, computados de forma simples, desde a data da citação (responsabilidade civil contratual). Dada a necessidade de fluência dos juros em período distinto da atualização monetária, inviável o emprego da taxa de juros legal, que é a taxa referencial do Sistema Especial de Liquidação e Custódia (Selic). A atualização, portanto, se dará segundo o INPC/IBGE, refletido na Tabela Prática para Cálculo de Atualização Monetária de Débitos Judiciais, divulgada pelo E. Tribunal de Justiça do Estado de São Paulo, enquanto os juros de mora, por inteligência residual do disposto no art. 406 do Código Civil em combinação com o artigo 161, § 1º, do Código Tributário Nacional, devem incidir à razão de 1% (um por cento) ao mês, computados de forma simples. Ante o exposto,",". É caso de imediato julgamento do mérito, porquanto os elementos amealhados se mostram suficientes para o deslinde do litígio. Inicialmente, registre-se que, tal como consignado no v. acórdão de fls. 215/223, não são aplicáveis as disposições do Código de Defesa do Consumidor ao caso em questão, haja vista que o serviço prestado pela requerida foi contratado para implementação de atividade comercial da requerente, não restando demonstrada qualquer vulnerabilidade, seja técnica, jurídica ou econômica em relação à requerida. Neste contexto, a intervenção judicial na dinâmica das relações privadas é excepcional, e, a teor de dispositivos como o artigo 421, parágrafo único, e o artigo 421-A, ambos do Código Civil, somente cabível quando houver afronta aos princípios e normas de ordem pública e natureza cogente, com a finalidade de adequar o contrato à sua função social. No caso, pretende o autor a declaração de inexigibilidade dos débitos cobrados posteriormente ao encaminhamento à ré de notificação na qual exteriorizou seu desinteresse em dar continuidade à relação contratual até então mantida (fls. 37/40), além do recebimento de indenização por danos morais, em razão do indevido protesto de título em seu nome. Com efeito, a despeito do quanto alegado na peça defensiva, restou suficientemente demonstrado nos autos que o requerente encaminhou notificação ao endereço constante do instrumento firmado entre as partes (fl. 167), solicitando a resilição contratual, sendo certo que a comunicação foi recebida no dia 27 de setembro de 2019 (fl. 38). Como cediço, ninguém pode ser obrigado a manter vínculo contratual com outrem caso assim não o deseje, cumprindo, na questão, apenas analisar se incide eventual penalidade para o caso o, o que é pacificamente reconhecido pela jurisprudência e dispensa maior aprofundamento: “A jurisprudência do Superior Tribunal de Justiça é no sentido de que, na hipótese de protesto indevido de título ou de inscrição irregular em cadastros de inadimplentes, o dano moral se configura in re ipsa - independentemente de prova” (AgInt. no AREsp. nº 1.679.481/MS, 4ª Turma, rel. Min. Antônio Carlos Ferreira, j. 28/9/20, DJe 1º/10/20). No que diz respeito ao valor, a indenização por dano moral, segundo reza a jurisprudência do E. Superior Tribunal de Justiça, “conserva a sua função pedagógico-punitiva de desestimular o ofensor a repetir a falta” (AgInt. no AREsp. nº 862.868/CE, 3ª Turma, Rel. Min. Moura Ribeiro, j. 16/6/16), o que também encontra respaldo em precedentes do C. Supremo Tribunal Federal (e.g., AgRg. no ARE nº 721.793, 1ª Turma, Rel. Min. Luiz Fux, j. 23/4/13). Atento a essas circunstâncias, tenho por adequado e suficiente o montante de R$ 5.000,00 (cinco mil reais) para a reparação. O montante em questão deve ser atualizado a partir desta data, nos termos do enunciado da Súmula 362 do E. Superior Tribunal de Justiça, e acrescido de juros de mora, computados de forma simples, desde a data da citação (responsabilidade civil contratual). Dada a necessidade de fluência dos juros em período distinto da atualização monetária, inviável o emprego da taxa de juros legal, que é a taxa referencial do Sistema Especial de Liquidação e Custódia (Selic). A atualização, portanto, se dará segundo o INPC/IBGE, refletido na Tabela Prática para Cálculo de Atualização Monetária de Débitos Judiciais, divulgada pelo E. Tribunal de Justiça do Estado de São Paulo, enquanto os juros de mora, por inteligência residual do disposto no art. 406 do Código Civil em combinação com o artigo 161, § 1º, do Código Tributário Nacional, devem incidir à razão de 1% (um por cento) ao mês, computados de forma simples. Ante o exposto,",null,null,"do necessário. Passo a decidir. Ausentes preliminares deduzidas em sede de contestação, cabe passar sem mais delongas ao exame do mérito. A lide comporta julgamento antecipado, uma vez que as questões fáticas já estão suficientemente comprovadas pelos documentos acostados aos autos, sendo desnecessários para deslinde da controvérsia a “quebra do sigilo telefônico” e o depoimento pessoal da ré pleiteados pela parte autora (art. 355, I, NCPC). Busca, a parte autora, com a presente demanda, obter a resilição do contrato firmado entre as partes, a condenação da ré ao reembolso da quantia de R$2.000,00 e o pagamento de indenização de R$10.000,00 a título de danos morais suportados. Argumenta contratação da ré, por telefone, em 20/10/16, com objeto a prestação de serviço de publicidade em lista telefônica, ao custo de R$210,00, parcela única. No entanto, em 2016, a ré efetuou cobranças de R$420,00, quantia alusiva a duas parcelas pendentes, e de R$1.580,00 a título de multa contratual pela resilição unilateral da autora, pagas pela demandante. Já em 2017, a ré efetuou cobrança total de R$12.000,00, diante da subsistente renovação automática contratual a cada período de trinta e seis meses, não quitada pela autora - sempre mediante inúmeras inconvenientes ligações telefônicas. Sublinhando a ofensa a direitos da personalidade em razão das cobranças abusivas, move a parte autora a presente demanda. A ré, por sua vez, rebate a pretensão sob argumento, em resumo, de inaplicabilidade do CDC à espécie, efetivação prestação de serviços à parte autora, celebração de contrato com pagamento de doze parcelas mensais e sucessivas de R$210,00, pelo prazo de três anos com renovação automática, inadimplência da parte autora, cancelamento em relação ao primeiro ano, vencimento antecipado das demais parcelas com multa de 40% e “pedido contraposto” de abatimento da multa contratual de R$2.016,00. Pacta sunt servanda. A hipótese é de parcial procedência da ação. Com efeito. Resilição contratual e reembolso de valores: De partida, note-se que a parte autora deixou de postular em sede exordial de maneira explícita a resilição do contrato firmado entre as partes, consoante seria imperativo a teor da lógica argumentativa delineada naquele petitório, bem assim a teor de expressão disposição legal (CPC, art. 319, IV): (...) A) A citação da Requerida A R DE ARAÚJO COMUNICAÇÕES ME., para, querendo, contestar os termos desta ação, no prazo legal, sob as penas da lei (confissão e revelia); B) Seja julgado totalmente procedente o pedido da Requerente, para o fim de condenar a Requerida ao pagamento de repetição de indébito relativo as cobranças indevidas, com acrescidos de juros legais e correção monetária a partir da data do ato ilícito até a data do efetivo pagamento. C) Condenar a Requerida ao pagamento de danos morais ao Requerido, no valor de 10.000,00 (dez mil reais), com acréscimo de juros de 1% ao mês e correção monetária pelo índice do Tribunal de Justiça de São Paulo. D) Condenar a Requerida ao pagamento das custas, despesas processuais e honorários advocatícios em caso de recurso, fixados à base legal, nos termos do artigo 20, § 3º, do CPC. (...) (fls. 14/15) Nada obstante, levando-se em conta que a interpretação do pedido considerará o conjunto da postulação e observará o princípio da boa-fé (CPC, art. 322, §2º), subentende-se que a inicial também contempla pleito de resilição contratual, antecedente lógico aos demais pedidos formulados na exordial. Feito o registro, note-se a aplicabilidade do CDC à espécie, em mitigação à teoria finalista (AgRg no AResp 601234/DF)., considerando as circunstâncias fáticas adiante esmiuçadas, bem assim o K de parcos 10 mil reais da parte autora, a realização de negócio jurídico pela ordem aproximada de duzentos reais e o objeto social de comércio de varejo de peças automotivas, denotando vulnerabilidade da parte autora, fator eventualmente justificador de exceção admitida na jurisprudência do STJ. Desta feita, considerando-se a verossimilhança da alegação, cabe a inversão do ônus da prova à espécie (CDC, art. 6º, VIII), dada a verossimilhança da alegação que emana da coerente narrativa fática posta em sede exordial. Nesse cenário, impunha à ré a demonstração de que o instrumento contratual de adesão às fls. 27 alusivo a edições 1/2/3, anos 16/17/18, valor mensal das parcelas 210,00, vazado em fonte de tamanho minúsculo, em termos práticos significava contratação de três anos de publicidade em lista telefônica, triênio 2016/2018, ao custo mensal de R$210,00. No entanto, nada veio de concreto aos autos neste tocante, sendo imperativa a observação de que nos contratos de adesão escritos serão redigidos em termos claros e com caracteres ostensivos e legíveis, cujo tamanho da fonte não será inferior ao corpo doze, de modo a facilitar sua compreensão pelo consumidor (CDC, art. 54, §3º). Tudo por exigência do dever anexo de informação (CDC, art. 6º, III), corolário da boa-fé objetiva enquanto cláusula geral determinante de padrão ético de conduta no tráfego jurídico (CDC, art. 422). Viabilizando ao consumidor a perfeita ciência a respeito de todas as características do objeto contratado. De resto, sintomática que a prestação de serviços em questão consistente em mera publicidade do estabelecimento empresarial-autor em sítio eletrônico www.guiaplus.net.br (fls. 87), revela palmar desproporcionalidade à remuneração exigida de R$210,00 mensais, ou R$2.520,00 anuais. Máxime tendo em vista a notória obsolescência de guia de serviços em tempos de sociedade de informação (CPC, art. 375), na qual grassa a ampla disponibilidade de aquisição de bens e serviços mediante aplicativos de toda sorte, inclusive, mediante cotações online. Dano moral: Melhor sorte, porém, assiste à ré quanto à pretensão de indenização a título de danos morais. Deveras. O mero descumprimento contratual não caracteriza dano moral. Dano moral é a lesão a um bem extrapatrimonial contido nos direitos da personalidade ou nos atributos da pessoa. Não decorrem os danos morais, desta maneira, de todo e qualquer aborrecimento, sendo de rigor a identificação de uma dor que ultrapassa aquela imposta pela vida cotidiana. A propósito afirma Carlos Roberto Gonçalves citando Sérgio Cavalieri: \"(...) só se deve reputar como dano moral a dor, vexame, sofrimento ou humilhação que, fugindo à normalidade, interfira imensamente no comportamento psicológico do indivíduo, causando-lhe aflições, angústia e desequilíbrio em seu bem estar. Mero dissabor, aborrecimento, mágoa, irritação ou sensibilidade exacerbada estão fora da órbita do dano moral, porquanto, além de fazerem parte da normalidade do nosso dia-a-dia, no trabalho, no trânsito, entre os amigos e até no ambiente familiar, tais situações não são intensas e duradouras, a ponto de romper o equilíbrio psicológico do indivíduo” (Responsabilidade civil, 11ª ed., p. 616). E não se pode olvidar que o puro e simples descumprimento de deveres não autoriza, automaticamente, o reconhecimento de dano moral, resolvendo-se as situações e os eventos no âmbito exclusivamente patrimonial, consoante já reconheceu o Superior Tribunal de Justiça (REsp 151.322-RS, Terceira Turma, Relator Ministro AriPargendler, DJ 02.12.02, p.303). Em síntese, mero inadimplemento não enseja indenização por danos morais. Por tudo quanto exposto, JULGO PROCEDENTE EM PARTE a ação ajuizada por RIBEIRO TEOFILO & TEOFILO LTDA em face de A R DE ARAÚJO COMUNICAÇÕES ME, para 1) declarar a resilição do contrato firmado entre as partes, retornando-as ao status quo ante e 2) condenar a ré a reembolsar à autora a quantia de R$2.000,00. A conta do desembolso (janeiro/2017), incidirá correção monetária com base na Tabela Prática do Tribunal de Justiça- TPTJ e juros de mora de 1% ao mês, estes a contar da citação. Em consequência,","SENTENÇA Processo Digital nº: 1013292-76.2018.8.26.0625 Classe – Assunto: Procedimento Comum Cível - Rescisão do contrato e devolução do dinheiro Requerente: Ribeiro Teofilo & Teofilo Ltda Me Requerido: A R de Araújo Comu ialmente, é de se ressaltar que a relação jurídica estabelecida entre as partes não tem natureza consumerista, pois objetiva o fomento da atividade empresarial, não sendo o caso, portanto, de ajuizamento da demanda perante o foro do domicílio da parte autora. Em situação similar, assim já se decidiu: AGRAVO DE INSTRUMENTO – Ação declaratória de inexigibilidade de débito – Decisão que acolheu a preliminar de incompetência e determinou a remessa dos autos a uma das Varas Cíveis da Comarca de São Paulo, domicílio do réu - Inconformismo – Não cabimento - Agravante que não detém a qualidade de consumidor final – Prestação de serviços de propaganda e publicidade do nome da agravante em lista telefônica e internet, visando ao incremento da atividade empresária – Competência do foro da sede da pessoa jurídica ré – Inteligência do artigo 53, inciso III, \"a\" do Código de Processo Civil – Decisão mantida – Recurso não provido. (TJSP; Agravo de Instrumento 2027431-09.2022.8.26.0000; Relator (a): Daniela Menegatti Milano; Órgão Julgador: 19ª Câmara de Direito Privado; Foro de Guaíra - 1ª Vara; Data do Julgamento: 09/06/2022; Data de Registro: 09/06/2022) Outrossim, não se vislumbra qualquer abusividade frente à cláusula de eleição de foro e, ainda que assim não fosse, os autos seriam remetidos ao foro de domicílio do réu, ex vi do artigo 53, III, \"a\", do Código de Processo Civil. Tratando-se de competência ratione loci, de natureza relativa e, tendo sido arguida pela demandada, não se prorroga, nos termos do artigo 65, do Código de Processo Civil.",". Assiste razão à requerida. Inicialmente, é de se ressaltar que a relação jurídica estabelecida entre as partes não tem natureza consumerista, pois objetiva o fomento da atividade empresarial, não sendo o caso, portanto, de ajuizamento da demanda perante o foro do domicílio da parte autora. Em situação similar, assim já se decidiu: AGRAVO DE INSTRUMENTO – Ação declaratória de inexigibilidade de débito – Decisão que acolheu a preliminar de incompetência e determinou a remessa dos autos a uma das Varas Cíveis da Comarca de São Paulo, domicílio do réu - Inconformismo – Não cabimento - Agravante que não detém a qualidade de consumidor final – Prestação de serviços de propaganda e publicidade do nome da agravante em lista telefônica e internet, visando ao incremento da atividade empresária – Competência do foro da sede da pessoa jurídica ré – Inteligência do artigo 53, inciso III, \"a\" do Código de Processo Civil – Decisão mantida – Recurso não provido. (TJSP; Agravo de Instrumento 2027431-09.2022.8.26.0000; Relator (a): Daniela Menegatti Milano; Órgão Julgador: 19ª Câmara de Direito Privado; Foro de Guaíra - 1ª Vara; Data do Julgamento: 09/06/2022; Data de Registro: 09/06/2022) Outrossim, não se vislumbra qualquer abusividade frente à cláusula de eleição de foro e, ainda que assim não fosse, os autos seriam remetidos ao foro de domicílio do réu, ex vi do artigo 53, III, \"a\", do Código de Processo Civil. Tratando-se de competência ratione loci, de natureza relativa e, tendo sido arguida pela demandada, não se prorroga, nos termos do artigo 65, do Código de Processo Civil.",null,"SENTENÇA Processo nº: 1036100-22.2019.8.26.0114 Classe - Assunto Procedimento do Juizado Especial Cível - Rescisão do contrato e devolução do dinheiro Requerente: Marçal e Azevedo Alinhamentos Ltda Epp Requerido: A R de Araújo Comunicações - Me (Guia Plus Comunicações) Juiz(a) de Direito: Dr(a). Henrique Nader Vistos. Em face do silêncio do exequente, considero a obrigação satisfeita e, por consequência,",". A preliminar de incompetência territorial encontra-se superada, uma vez que fundamentada na inexistência da relação de consumo, com o que haveria a prevalência da cláusula de eleição de foro (cláusula 10, fls. 33), ou aplicação do art. 53, III, a, CPC (fls. 99), tendo a decisão saneadora, mencionado a preliminar e assentado a incidência do regramento do CDC, inclusive com inversão do ônus da prova, com atribuição à ré da prova da legalidade da contratação (fls. 142/143). Assim, refutado o fundamento sobre o qual se sustentava e determinado o prosseguimento do processo, sem qualquer recurso da ré, ultrapassada a preliminar. No mérito, observo que, logo no início da audiência, foi oferecida proposta, pela ré, de rescisão contratual, sem ônus para a autora, e de declaração de inexigibilidade de todos os débitos, o que contradiz com a conduta, assumida em sua defesa, de validade do contrato com todas as suas consequências. A testemunha da autora, Mizrael Caldeira Lima, contou que trabalhava na autora, à época, e atendeu ligação da ré, que disse querer fazer uma atualização de cadastro para que quando as pessoas fizessem pesquisa na internet já seriam direcionados aos contatos corretos; passou o contato da ré ao responsável, na autora, pelo assunto; desde início, falaram que era atualização de cadastro, sem custo algum, porque a empresa já tinha sido cliente deles no passado; dias depois, apareceu cobrança de valor de mil e poucos reais, e diziam que haviam sido contratados, o que não era verdade; faziam ameaças de prejuízo ao CPF dos diretores e ao CNPJ da empresa, e protesto inviabilizaria negócios com os fornecedores; somente por isso resolveram pagar a primeira fatura; acharam que fosse ficar nesse valor, mas passados alguns dias, houve nova cobrança, de valor de cinco mil e poucos reais; argumentaram que falaram que se tratava apenas de atualização de cadastro, sem custo, mas a ré exigiu o pagamento, dizendo que haveria terceira cobrança; entre o primeiro e o segundo pagamentos decorreram 30 ou 40 dias; ameaçavam constantemente com restrição do CNPJ e protesto; nenhum boleto de cobrança foi encaminhado antes disso. Interessante que o defensor da ré não fez qualquer repergunta à testemunha. Acrescente-se que a autora juntou consulta ao sistema e-SAJ, do TJSP, que acusou a existência, até então, de 177 processos contra a ré, relativos a rescisão de contrato, devolução de valores, sustação de protesto, defeito, nulidade ou anulação de negócio jurídico, demonstrando o volume de feitos que buscam o Poder Judiciário contra conduta da ré (fls. 38/40) Também juntou reclamações contra a ré, registradas no sítio “reclameaqui”, que acusam o mesmo modus operandi de ligação enganosa para falsa atualização de cadastro (fls. 41/43). Finalmente, juntou cópia de sentenças proferidas por juízos do TJSP, com pedidos diversos, todos com fundamento na conduta da ré de cobrar valores em decorrência de contrato/relação jurídica que se reconheceu inexistente (fls. 47/88) Assim, diante dos elementos trazidos pela autora, e não provada pela ré a legalidade da contratação (fls. 116/127), como lhe cabia, conforme ônus que lhe foi atribuído (fls. 143), e sequer a prestação do serviço, sendo imprestável ao mister o documento colacionado às fls. 104 da contestação, há que se reconhecer a abusividade da exigência dos valores pagos (fls. 35 e 37), no total de R$ 6.384,00. Desta forma, procede a restituição do valor de R$ 6.384,00, de forma dobrada, uma vez evidenciada a má-fé da ré, com conduta temerária para a obtenção de vantagem do consumidor. Também procede o pedido por dano moral, por se utilizar de expediente abusivo como meio de vida, ludibriando consumidores e obtendo o pagamento de valores indevidos, em valores, inclusive, despropositados, com ameaças de protesto/restrições, fazendo com que suas vítimas é que tenham que fazer valer seus direitos, contratando advogados e ingressando com demandas. Na fixação do valor, tenho por razoável o montante pedido, de R$ 6.384,00, o que não se constitui em enriquecimento sem causa da autora e promove desestímulo à ré na perseverança da conduta abusiva. Ante o exposto,",". A preliminar de incompetência territorial encontra-se superada, uma vez que fundamentada na inexistência da relação de consumo, com o que haveria a prevalência da cláusula de eleição de foro (cláusula 10, fls. 33), ou aplicação do art. 53, III, a, CPC , inciso I Código de Processo Civil, uma vez que os fatos declarados pelas partes e a prova por elas coligida aos autos se mostra suficiente para o deslinde das questões controvertidas, mostrando-se irrelevante e desnecessária a produção da prova de natureza oral reclamada pela autora. A preliminar que bate pela incompetência não prospera. Como se sabe, o chamado foro de eleição tem expressa previsão no art. 63 do CPC, que permite às partes modificar a competência em razão do valor ou território. E tal previsão legal é prestigiada pelo disposto na Súmula 335 do STF. No caso dos autos, entretanto, aplicam-se as disposições do Código de Defesa do Consumidor, pois clara a adoção legislativa por uma noção objetiva de consumidor, contemplando expressamente a possibilidade da pessoa jurídica ser tratada como tal, desde que adquira o produto ou utilize o serviço como destinatária final (cfr. Cláudia Lima Marques, Contratos no Código de Defesa do Consumidor: o novo regime das relações contratuais, 4ªed., Revista dos Tribunais, p. 253). Tal posicionamento vem sendo utilizado pelo Superior Tribunal de Justiça, e sua essência resta sintetizada por Claudia Lima Marques nos seguintes termos: “Em casos difíceis envolvendo pequenas empresas que utilizam insumos para a sua produção, mas não em sua área de 'expertise' ou com uma utilização mista, principalmente na área dos serviços; provada a vulnerabilidade, concluiu-se pela destinação final de consumo prevalente (...) Esta nova linha, em especial do STJ, tem utilizado, sob o critério finalista e subjetivo, expressamente a equiparação do art. 29 do CDC, em se tratando de pessoa jurídica que comprova ser vulnerável e atua fora do âmbito de sua especialidade, como hotel que compra gás.” (Comentários ao Código de Defesa do Consumidor, 2ª ed., Revista dos Tribunais, p. 85). Sendo assim, temos dentre as disposições do referido códex, as que proíbem colocar o consumidor em desvantagem exagerada (art. 51, IV) e as que determinam a facilitação de sua defesa em juízo (art. 6º), sendo certo que em tal condição se enquadra a autora, pois se trata de pequena empresa sediada nesta Comarca e o foro eleito pelas partes mostra-se por demais prejudicial ao exercício de sua defesa em Juízo, vez que indica a Capital do Estado, distante do seu domicilio. Assim, reconheço a abusividade da cláusula de eleição de foro presente no contrato firmado pelas partes e defino a competência deste Juízo para processar e julgar a presente ação. No mérito, a autora invoca a existência de vício do consentimento na contratação derivada do instrumento juntado a págs. 30, aduzindo que foi firmado por um funcionário sem poderes de representação e que foi surpreendida pela cobrança do débito que ensejou o protesto de págs. 31/32, motivo pelo qual pretende a declaração de inexistência de relação jurídica e a reparação de danos morais sofridos. A ré defende a regularidade da contratação, invocando a denominada Teoria da Aparência. Pois bem. Conforme se infere dos autos, a ré é empresa que atua em várias localidades deste País, na área de publicações em lista telefônica, restando incontroverso que a captação do contrato objeto do litígio ocorreu, conforme narrou a inicial, através de contato com o funcionário da autora, de nome Saulo Bezerra, o qual firmou antefalado contrato em nome da empresa. Contudo, nos termos do contrato social da autora (págs. 19/29), o aludido funcionário não possui poderes de representação, mormente para contrair obrigações em nome da pessoa jurídica, fato este para o qual a ré deveria atentar, porquanto se trata de medida de singela consecução. Bastaria ao preposto da ré indagar se o funcionário possuía tais poderes, ou então pedir para tratar diretamente com um dos sócios da autora, o que decerto não promoveu, por mera conveniência. E esta falta de cautela tão simples, denota a assunção pela ré do risco de contratar com pessoa sem poderes de representação para assumir obrigações em nome da empresa autora, o que, por consequência, exclui a necessária manifestação de vontade. Nestes moldes, a confiança depositada na eficácia do negócio assim celebrado revela-se injustificada e não pode ser convalidada pela aplicação da Teoria da Aparência, sobretudo por desvelar método comercial desleal e que não respeita as normas de regência. Vale dizer, a ré atuou despreocupada em garantir a legitimidade do negócio, privilegiando apenas a obtenção da cliente, independentemente da capacidade daquele que se apresentou para celebração, embora possuísse meios e condições de agir de forma diversa, exigindo a representatividade correta no momento da adesão. Evidente, nesse compasso, a violação aos princípios que regem as relações jurídicas contratuais, em especial o da boa-fé objetiva (cláusula geral), o da probidade e o da lealdade, conforme previsto no art. 422 do CC. Sendo assim, não há amparo para invocação da Teoria da Aparência no caso concreto, a qual não se harmoniza com a falta de cautela e de boa-fé, na forma anteriormente exposta. De rigor, portanto, que se reconheça a nulidade da contratação, com declaração de inexistência de relação jurídica válida entre as partes, derivada do contrato de págs. 30, devendo a ré responder pelos danos causados à autora. Neste último particular, mister consignar que em sua defesa a ré não negou a lavratura do protesto impugnado na inicial, o qual, segundo fato também incontroverso, teve por fundamento dívida derivada do contrato ora reconhecido como nulo perante a autora. Nesse diapasão e à vista do contido nos não impugnados documentos de págs. 31/32, que atestam o protesto, temos por configurada a existência da restrição indevida, decorrendo deste fato máculas contra o nome da empresa autora. Bem caracterizado está, portanto, o prejuízo moral invocado na petição inicial, pois, como é sabido e ressabido, o protesto indevido acarreta transtornos nas relações da empresa, constituindo fonte de prejuízos à sua imagem e ao desenvolvimento de suas atividades, abalando o seu nome e sua credibilidade. O culto Ministro Octávio Gallotti, ao proferir seu voto como relator do RE 109.233-5-MA, justamente em ação de indenização análoga à presente, onde se discutia a possibilidade de ressarcimento do dano moral, incluiu em suas razões a seguinte lição, que tal como luva de mão própria bem serve para definir esta modalidade de dano: No conceito sempre claro de Roberto de Ruggiero, para ser o dano indenizável basta a perturbação feita pelo ato ilícito nas relações psíquicas, na tranqüilidade, nos sentimentos, nos afetos de uma pessoa para produzir uma diminuição no gozo do respectivo direito (Instituições de Direito Civil, trad. da 6ª ed. italiana, com notas do Dr. Ary dos Santos, Ed. Saraiva, São Paulo, 1937). Quanto aos critérios para estabelecer o montante da indenização pertinente ao caso, observo que o julgador deve levar em linha de conta os fatos e o dano propriamente ditos, bem como a situação das partes, de forma que o lesado seja compensado pela dor moral que sofreu, e o causador seja educado para evitar a reincidência do ato indevido. Levando estes parâmetros em linha de conta, tenho para mim que revela-se condizente ao caso que a indenização a ela devida seja fixada em R$8.000,00 (oito mil Reais). No sentido do exposto, trago à colação o seguinte aresto, inclusive envolvendo a ora ré, que bem se presta a ilustrar o entendimento ora externado: AÇÃO DE ANULAÇÃO DE NEGÓCIO JURÍDICO CUMULADA COM PEDIDO DE INDENIZAÇÃO. SENTENÇA DE PARCIAL PROCEDÊNCIA. APELAÇÃO DESPROVIDA COM DETERMINAÇÃO. CONTRATO DE PRESTAÇÃO DE SERVIÇOS. PUBLICIDADE. POSTURA COMERCIAL DOLOSA. NÃO APLICAÇÃO DA TEORIA DA APARÊNCIA. PROTESTO. DANOS MORAIS RECONHECIDOS. INDENIZAÇÃO MANTIDA. Ação declaratória de nulidade contratual cumulada com pedido de indenização. Sentença de parcial procedência. Recurso da ré. Primeiro, mantém-se a nulidade do contrato. Postura comercial abusiva. Abordagem telefônica de funcionário com proposta de veiculação da empr
