fls.1/15), a requerente é uma empresa que atua no comercio varejista de embarcações e, no dia 29 de março de 2022, recebeu ligação telefônica de pessoa que se identificou como funcionária da empresa requerida, ofertando a atualização da requerente em “Lista Telefônica” oficial; justificou a necessidade de atualização do cadastro, informando que 'não haveria qualquer custo', vez que se tratava de mera atualização de dado; por se tratar de mera atualização de dados, sem qualquer ônus ou contratação de serviço, o atendimento da representante da requerida se deu por funcionária da requerente, de nome Ana Fernanda Takashi. Contudo, foi preenchido um formulário, que não se tratava de atualização cadastral, denominado “Contrato de Figuração”, com cláusulas em letras minúsculas, fazendo-a assinar como se fosse representante legal da requerente. Em pesquisa realizada junto ao e-Saj do Tribunal de Justiça do Estado de São Paulo, verificou-se que até momento da distribuição desta ação, existem 235 ações envolvendo a requerida, nas mais variadas cidades deste Estado de São Paulo. O nominado “Contrato de Figuração” trazia, nas entrelinhas a suposta contratação de anúncios via web/DC e banner digital web, que seriam pagos em 36 parcelas de R$ 350,00 (trezentos e cinquenta reais) cada uma, alusivas aos exercícios de 2022, 2023 e 2024, denominados de “3 edições”. Ao ser comunicada acerca dos fatos a proprietária da empresa, realizou Reclamação no PROCON, em 18 de agosto de 2022, por meio de seu esposo, sem obter retorno da requerida, nem respondeu ao expediente do PROCON, também não compareceu à audiência agendada pelo referido órgão. Foi também lavrado b.o. por estelionato em 24 de abril de 2023 contra a requerida, tendo como “pessoa relacionada”, Ana Fernanda Takashi, sem dar prosseguimento com representação; em maio de 2023, a autora foi surpreendida com o recebimento de um aviso de protesto, com título apontado no valor de R$ 350,00; a requerida também notificou a requerente em 16/08/23, pelo que a autora tentou contranotificar a ré, porém a correspondência retornou sob o registro de “desconhecido”, que não havia empresa com esse nome no endereço destinado; desde que tomou ciência dessa situação, a requerente não pagou o título apontado e levado a protesto em 05/2023 (protocolo nº 386865/27/04/2), por ser manifestamente indevido. Que tal situação que muito prejudica a requerente perante seus clientes, fornecedores e instituições financeiras com as quais trabalha, considerando que mantém relacionamento próximo com tais instituições bancárias em razão da própria natureza de seu negócio. Assim, pugnou pela concessão da tutela de urgência a fim de que os efeitos de protesto do título já lavrado, bem como determinar à requerida que se abstenha de negativar e/ou enviar para protesto ou para qualquer outro órgão ou cadastro de inadimplentes, sob pena de multa. No mérito, requereu a procedência da ação para (i) tornar definitiva a tutela de urgência, declarando a inexistência de relação jurídica entre as partes; (ii) a declaração de inexigibilidade de todos os títulos dele originados; (iii) a condenação da requerida ao pagamento da quantia de R$ 10.000,00 (dez mil reais) por danos morais, devidamente atualizado com juros e correção monetária, conforme autoriza a legislação. Juntou documentos (fls.17/130) O pedido da tutela de urgência foi concedido (fls.135/136). A ré ofertou contestação (fls.145/158). No mérito, sustentou pela legitimidade da contratação, solicitando os serviços de publicidade em lista telefônica e internet da empresa ré; a requerida, empresa regularmente constituída, na busca de sua consecução social, nos termos de seus atos constitutivos, comercializa e gerencia por meios eletrônicos, anúncios de empresas em site na internet que buscam divulgar sua marca e assim aumentar a sua lucratividade, tudo oficializado por meio da celebração de um contrato de prestação de serviços; quanto aos fatos, afirmou que o aludido contrato foi firmado por 02 pessoas jurídicas, no dia 29 de março de 2022, mediante apresentação de proposta dos serviços pela ré e efetiva assinatura do termo pela representante da empresa autora, conforme \"Contrato de Figuração\" firmado entre as partes, houve a previsão da forma como se daria a publicidade contratada no site comercial da requerida; o contrato foi assinado por Fernanda, gerente da empresa requerente, tendo negociado os termos estabelecidos no contrato, inclusive no que se refere à forma de publicidade que estava sendo contratada; a empresa recebeu um contrato físico através de pessoa que se apresentou como proprietária da empresa, tendo posteriormente o assinado e reencaminhado de forma espontânea o referido documento à requerida; em relação à boa-fé objetiva, nas relações contratuais e pela Teoria da Aparência, a pessoa jurídica deve responder pelas obrigações contraídas por seus funcionários em atos que sejam pertinentes ao trabalho no estabelecimento, principalmente pelo fato de que naquelas circunstâncias tudo levava a crer que a Requerida estava formalizando uma relação contratual com alguém que seria responsável pela Empresa. Ao final, pugnou pela improcedência do pedido. Juntou documentos (fls.162/167) Houve Réplica (fls.171/173) Instadas a especificarem as provas que desejavam produzir, a parte autora pugnou pela produção de prova testemunhal (fls.177). A parte autora manifestou desistência a produção de prova testemunhal, pugnando pelo andamento processual (fls.178). Por fim, após determinação, juntou-se aos autos o contrato assinado e legível (fls. 186).","SENTENÇA Processo Digital nº: 1000752-03.2024.8.26.0587 Classe - Assunto Procedimento Comum Cível - Práticas Abusivas Requerente: Sea Peças Ltda Requerido: A.r. de Araujo Comunicações - Lista Regional Brasil Juiz(a) de Direito: Dr(a). Vitor Hugo Aquino de Oliveira Vistos. 1. Trata-se de ação declaratória de inexistência de relação jurídica e inexigibilidade de débito c.c. indenização por danos morai uerido: A R de Araújo Comunicações Me- Guia Mais Plus Juiz de Direito: Dr. Celso Alves de Rezende Vistos. Mercadante & Cardoso Ltda.-ME, qualificada nos autos, moveu ação declaratória de inexigibilidade de débito c.c. pedido de tutela de urgência e de indenização por danos morais contra A R Araújo Comunicações ME, alegando, em síntese, que tendo celebrado com a requerida, em 05/01/2017, um contrato de prestação de serviços de veiculação de anúncio na lista telefônica denominada “Lista Mais”, de forma a divulgar o nome comercial da requerente, atuante no ramo de prestação de serviços de mecânica e manutenção de automóveis, se viu surpreendida, em janeiro de 2018, com a cobrança de R$ 2520,00, sob a pena de inscrição de seu nome nos órgãos de proteção ao crédito, vindo a saber, posteriormente, ter a requerida apontado para protesto um título de R$ 5.040,00, referente a 24 meses de prestação de serviços de anúncio, ao valor mensal de R$ 210,00, quando na verdade havia contratado o serviço pelo valor de R$ 210,00 para pagamento em 12 prestações, razão pela qual, sustentando ter sido vítima do “golpe da lista telefônica”, com consequentes constrangimentos de ordem pessoal, requereu a concessão de tutela de urgência para impor à requerida a abstenção de negativação de seu nome junto aos órgãos de proteção ao crédito, e ao final a procedência do pedido para declarar rescindido o contrato firmado com a requerida, assim como inexigível a importância mencionada, condenando-a no pagamento de indenização por danos morais no importe de R$ 5.000,00, bem como nas verbas de sucumbência. A inicial veio instruída com os documentos de fls. 21/65, deferindo-se à fls. 66/7 o pedido de tutela de urgência. Resposta da requerida à fls. 71/94. Réplica à fls. 98/103. Instadas a especificarem as provas pretendidas à produção, requereram as partes o julgamento antecipado da lide (fls. 104, 106 e 107/9).",null,"SENTENÇA Processo Digital nº: 1001680-77.2019.8.26.0344 Classe - Assunto Procedimento Comum Cível - Rescisão do contrato e devolução do dinheiro Requerente: Paulo Henrique da Silva Requerido: A R de Araújo Comunicações Me- Guia Mais Plus Justiça Gratuita Juiz(a) de Direito: Dr(a). LUIS CESAR BERTONCINI Vistos. PAULO HENRIQUE DA SILVA (e sua empresa PAULO HENRIQUE DA SILVA – ME) propõe a presente ação rescisória de contrato c/c indenização por danos morais e materiais contra A. R. DE ARAÚJO COMUNICAÇÕES ME (GUIA MAIS PLUS), alegando, em síntese, que em 27/09/2017, funcionária da empresa requerida ofereceu a prestação do serviço de anúncio em lista telefônica, por meio do pagamento da parcela única no valor de R$ 210,00, cuja proposta foi aceita por representante da parte autora, sendo firmado o contrato de n.º 17648-G. Alega, entretanto, que passados alguns dias, representante da ré entrou em contato com a parte autora informando que havia “boletos em aberto”, cada um no valor de R$ 210,00, os quais, se não pagos, acarretariam na inclusão do nome da parte demandante em órgão de proteção ao crédito. Aduz que, nesta ocasião, tomou conhecimento de que na verdade seriam 36 (trinta e seis) prestações contratuais no valor de R$ 210,00 (duzentos e dez reais) cada uma, e não apenas uma. Sustenta que a parte requerida deveria ter sido clara e informar corretamente que o contrato abrangeria 36 parcelas. Alega, ainda, que o serviço da ré foi oferecido como se fosse uma lista telefônica impressa, todavia, trata-se de lista telefônica digital, disponibilizada em endereço eletrônico na internet. Assim requer, em sede de tutela de urgência, que a requerida se abstenha de inscrever o nome da parte requerente nos órgãos proteção ao crédito, bem como deixe de protesta-la em cartório. Ao final, pede a procedência da ação para que seja confirmada a tutela de urgência pretendida, bem como seja declarada a rescisão do contrato firmado entre as partes e que a requerida seja condenada ao pagamento de indenização por danos morais e danos materiais. Junta documentos (fls.19/38). Emenda à inicial (fls. 42 e fls. 50). Deferido à parte autora os benefícios da gratuidade judiciária (fls. 43 e fls. 53/54). A decisão de fls. 53/54 indeferiu o pedido de tutela de urgência. Devidamente citada (fls. 62), a requerida apresentou contestação (fls. 63/87). Preliminarmente, suscita incompetência territorial em razão da inexistência de relação de consumo. No mérito, sustenta a validade da relação jurídica firmada, bem como que as cobranças realizadas estão amparadas contratualmente, sendo, portanto, devidas. Alega que o requerente, em evidente arrependimento tardio, busca imputar má-fé na conduta da requerida para justificar rescisão contratual. Sustenta que cumpriu de imediato suas obrigações assumidas contratualmente, inscrevendo os dados da empresa autora em seu site comercial. Sustenta a inexistência de danos morais. Ao final, requer o acolhimento da preliminar ou a improcedência da ação. Junta documentos (fls. 88/114). Réplica (fls. 123/140).",null,"SENTENÇA Processo Digital nº: 1002630-96.2023.8.26.0457 Classe - Assunto Tutela Antecipada Antecedente - Liminar Requerente: Marcio Rogerio de Oliveira Auto Elétrica Requerido: A R de Araújo Comunicações-me (Guia Plus) Tramitação prioritária Juiz(a) de Direito: Dr(a). Vivian Brenner De Oliveira Vistos. MÁRCIO ROGÉRIO DE OLIVEIRA AUTO ELÉTRICA, devidamente qualificado, ingressou com tutela provisória de urgência de natureza antecipada em caráter antecedente em face de A.R. DE ARAÚJO COMUNICAÇÕES ME, também qualificado. Narra que no dia 22 de junho, recebeu do 12º Tabelionato de Notas e Protestos local, a intimação para protesto anexa, dando conta de a requerida sacara contra si, o DMI 94042G, no valor de R$350,00, vencido em 19/06/2023, e que sob pena de protesto, deveria ser pago até 28/06/2023. Contudo, a autora alega que nunca manteve qualquer negociação com a requerida. Requer ao final a procedência da ação. Juntou procuração e documentos a fls. 07/16. A tutela de urgência foi deferida a fls. 17. um Cível - Rescisão do contrato e devolução do dinheiro Autor: Nucci e Aleixo Farmácia Homeopática Ltda. Réu: A. R. de Araújo Comunicações ME. -Lista Regional Brasil Juiz(a) de Direito: Dr(a). Renato Acacio de Azevedo Borsanelli Vistos. Nucci e Aleixo Farmácia Homeopática Ltda ajuizou ação de rescisão de contrato contra A R Araujo Comunicações ME Lista Regional Brasil sob a alegação de ter recebido telefonema da Ré dando conta da necessidade de atualização de cadastro para viabilizar manutenção de contato. Disse que, após a insistência da Ré, um formulário lhe fora remetida, já preenchido, restando apenas a assinatura, que deveria ser devolvido para um numero de telefone, via Wattsapp. Alegou que o procedimento se repetiu dias depois. Tempos depois, recebeu cobrança de R$ 5.800,00, por meio de novo telefonema, o que fora confirmado por meio de um preposto da Ré. Assim, alegou ter sido vítima de conduta ilícita da Ré e ter pedido o cancelamento dos contratos, sem que obtivesse resposta. Disse ter recebido notificação de cobrança, bem como que a Ré lhe aplicara um golpe. Socorreu-se das disposições da Lei Federal 8.078/90 e disse ter sofrido dano moral. Fez pedido de tutela de urgência para que a Ré não efetuasse cobrança alguma. Ao final, pediu pela procedência da ação para que fossem anulados ou rescindidos os contratos 38291 e 38414, bem como condenação da Ré em reparar o dano moral, estimado em R$ 12.000,00. Deu à causa o valor de R$ 18.960,00. O pedido de antecipação foi acolhido a fls. 40. Citada ( fls. 43), a Ré apresentou contestação ( fls. 44/65), oportunidade em que, preliminarmente, alegou incompetência do Juízo. Disse, no mérito, que o contrato era válido, eis que subscrito pela própria representante legal da Autora. Alegou que o valor cobrado era exigível, mesmo porque o serviço fora prestado. Socorreu-se da chamada teria da aparência e ainda que se tratava de contrato por prazo indeterminado. Defendeu a legalidade e higidez do contratação e que a Autora, se quisesse, poderia ter desistido do negócio no prazo de sete dias. Negou relação de consumo e, ao final, pediu pela improcedência da ação. Réplica a fls. 82/92. Os autos vieram remetidos a este Juízo, eis que acolhida a exceção de incompetência ( fls. 94/94). Instadas a especificar provas ( fls. 100), a Autora disse a fls. 102/105 e a Ré silenciou ( fls. 106).",null,"SENTENÇA Processo Digital nº: 1007007-81.2017.8.26.0664 Classe - Assunto Procedimento do Juizado Especial Cível - Rescisão do contrato e devolução do dinheiro (Antecipação de Tutela / Tutela Específica) Requerente: Centro de Educação Infantil Camorin Ltda - ME Requerido: A R de Araújo Comunicações ME - Guia Plus Nome do Juiz(a): Carolina Marchiori Bueno Cocenzo V I S T O S CENTRO DE EDUCAÇÃO INFANTIL CAMORIN LTDA ME, devidamente qualificada, ajuizou a presente ação em face de A.R. DE ARAÚJO COMUNICAÇÕES ME (GUIA PLUS), empresa devidamente qualificada e representada nos autos. A autora pleiteia a declaração de nulidade do contrato firmado entre as partes e inexistência de débito, além da devolução do valor pago. Tutela antecipada concedida a fls. 52/53. Na audiência de conciliação, não houve acordo entre as partes (fls. 104/105). RELATÓRIO (dispensado nos termos do artigo 38 da Lei 9.099/95)",null,"SENTENÇA Processo Digital nº: 1008201-03.2022.8.26.0451 Classe - Assunto Procedimento Comum Cível - Protesto Indevido de Título Requerente: Diego Cesar Strazzacapa Me Requerido: A R de Araujo Comunicações ME Justiça Gratuita Juiz(a) de Direito: Dr(a). RENAN AUGUSTO JACÓ MOTA Vistos. Trata-se de ação declaratória de inexigibilidade de débito com pedido indenizatório movida por DIEGO CÉSAR STRAZZACAPA ME em face de A R DE ARAÚJO COMUNICAÇÕES ME. Narra a inicial, em síntese, que as partes, em 19/9/18, celebraram “contrato para divulgação multiplataforma dos contatos da empresa requerente na 'Lista Regional Brasil'”, comprometendo-se o autor com o pagamento mensal do valor de R$ 290,00. Aduz que, após 12 meses da contratação e antes da edição de 2020, ante o desinteresse na continuidade da relação, buscou a resilição contratual, tendo encaminhado notificação à ré. Contudo, a despeito da solicitação realizada, a requerida encaminhou títulos para protesto, referentes ao período compreendido entre setembro/2019 e agosto/2021, o que impossibilitou o autor “de ter acesso a crédito e de efetuar compras parceladas de peças de veículos”. Diante do exposto, pugna, em sede de cognição sumária, pela suspensão da exibição de restrição negativa em seu nome, e, ao final, a declaração de inexistência do débito (R$ 870,00), além da condenação da ré ao pagamento de indenização por danos morais no valor de R$ 12.000,00. A inicial veio acompanhada com os documentos de fls. 10/44. O pleito antecipatório foi deferido pela decisão de fls. 46/48. Os benefícios de gratuidade de justiça foram concedidos ao autor pelo v. acórdão de fls. 125/134. Promovida a citação (fl. 146), a requerida ofertou contestação (fls. 148/163), sustentando, preliminarmente, a incompetência territorial, uma vez que há cláusula de eleição de foro prevista contratualmente. No mérito, aduz a validade do contrato e exigibilidade dos valores e das cobranças, pois houve a prestação de serviços pela ré. Além disso, impugna a aludida notificação para resilição encaminhada pela parte autora, pois não recebida, salientando que, mesmo em caso de manifesto desinteresse em continuidade do pactuado, é necessário o pagamento da multa rescisória prevista no instrumento contratual. Aduz que, para evitar a renovação automática, a solicitação do autor deveria ser encaminhada ao final do período de 36 meses e não de 12 meses, uma vez que o pagamento das mensalidades foi subdividido em 3 edições de 36 meses cada. Esclarece que cumpriu de imediato com as obrigações assumidas contratualmente, inscrevendo os dados da empresa do autor em seu site comercial. Pugna pela improcedência da demanda. Réplica a fls. 175/178. Instados a se manifestarem avor de A. R. DE ARAÚJO COMUNICAÇÕES LTDA. Aduz que celebrou contrato de adesão prestação de serviços de veiculação de propaganda nos meios de comunicação, tais como mídias virtuais, redes sociais e outros, assinado por uma funcionária sua. No entanto, sustenta que o contrato é nulo de pleno direito: a) não discrimina os dados pessoais da empresa contratada, tais como CNPJ, endereço, representante legal,e etc; b) não possui assinatura de nenhum representante legal, seja do parte autora, seja da parte ré; c) não especificação dos tipos de serviços contratados, períodos e formas de veiculação das propagandas, como também não especifica em quais meios de comunicação será veiculada e tempo de exposição; d) contrato não possui cláusula resolutiva. Não recebeu notificação da negativação do nome. Alega que houve enriquecimento sem causa, pois nenhum serviço foi efetivamente prestado. Pede tutela de urgência para determinar anulação do registro do nome da empresa nos órgãos de proteção ao crédito – SERASA. Aditada a inicial com o recolhimento das devidas custas, foi indeferido o pleito de tutela de urgência e determinada a citação. Veio contestação na qual se alega, em síntese e preliminarmente, incompetência territorial do juízo, ante a existência de clausula de foro de eleição. No mérito, afirma ser o contrato firmado dentro da legalidade, sem nenhum sofisma ou erro. Teve sua prestação de serviços executados a contento, sendo a insurgência mero arrependimento, fato que culminaria na cobrança de multa rescisória. Instadas as partes em especificar provas e a parte autora em apresentar replica, quedaram-se inertes. É o que de importante havia a relatar.","SENTENÇA Processo Digital nº: 1012875-14.2020.8.26.0477 Classe - Assunto Procedimento Comum Cível - Defeito, nulidade ou anulação Requerente: Angelo Fonseca Matos-eletrica-me Requerido: Ar de Araujo Comunicaçoes Me Juiz(a) de Direito: Dr(a). Eduardo Hipolito Haddad Vistos. AÇÃO DE ANULAÇÃO DE PROTESTO que ÂNGELO FONSECA MAT  V I S T O S. Cuida-se de ação de procedimento comum ajuizada por RIBEIRO TEOFILO & TEOFILO LTDA em face de A R DE ARAÚJO COMUNICAÇÕES ME, visando a obter a resilição do contrato firmado entre as partes, a condenação da ré ao reembolso da quantia de R$2.000,00 e o pagamento de indenização de R$10.000,00 a título de danos morais suportados. Com a inicial, os documentos às fls. 16/44, complementados às fls. 50/51. Emenda à exordial às fls. 48/49. Citada, a ré apresentou contestação às fls. 57/75. Bate-se pela improcedência da ação sob argumento, em resumo, de inaplicabilidade do CDC à espécie, efetivação prestação de serviços à parte autora, celebração de contrato com pagamento de doze parcelas mensais e sucessivas de R$210,00, pelo prazo de três anos com renovação automática, inadimplência da parte autora, cancelamento em relação ao primeiro ano, vencimento antecipado das demais parcelas com multa de 40% e “pedido contraposto” de abatimento da multa contratual de R$2.016,00. Pacta sunt servanda. Com esta peça, os documentos às fls. 129/138. Réplica às fls. 142/145, rechaçando os termos da contestação e reiterando o conteúdo da preambular. Prejudicada a designação de audiência de tentativa de conciliação em face do desinteresse das partes e despiciendos, para deslinde da controvérisa posta, a “quebra do sigilo telefônico” e o depoimento pessoal da ré pleiteados pela parte autora, vieram-me os autos conclusos para prolação de sentença.",null,"SENTENÇA Processo Digital nº: 1014723-98.2023.8.26.0196 Classe - Assunto Procedimento Comum Cível - Indenização por Dano Moral Requerente: Farmácia de Manipulação Masini Ltda Requerido: A R de Araújo Comunicações Tramitação prioritária Juiz(a) de Direito: Dr(a). Adriana Gatto Martins Bonemer Vistos. FARMÁCIA DE MANIPULAÇÃO MASINI LTDA ajuizou ação em face de A. R. DE ARAÚJO COMUNICAÇÕES alegando, em síntese, que: em 25/04/2023, a requerida entrou em contato com a empresa autora, oferecendo serviços de publicidade digital; a requerida conversou com a funcionária da autora, VALÉRIA, que não detém poderes para representá-la, mas que firmou a contratação; a representante da empresa autora, REGINA MÁRCIA, só teve ciência da contratação, após o recebimento do boleto de cobrança; a autora entrou em contato com a requerida, explicando o ocorrido, mas a requerida exigiu o pagamento de multa pela rescisão contratual; o contrato está eivado de vício, já que assinado por pessoa que não possui legitimidade para representar a autora; o boleto em nome da autora foi protestado; a requerida, ao incluir o nome da autora no rol de inadimplentes, em virtude de débito inexistente, violou o direito da autora, causando dano moral que deverá ser indenizado. Requereu a procedência da ação, declarando-se a inexigibilidade da dívida, com a anulação do contrato e o cancelamento do protesto; a condenação da requerida ao pagamento de indenização por danos morais, no valor de R$ 15.000,00. Foi concedida tutela provisória de urgência (fls. 41/42). A requerida apresentou contestação (fls. 47/60) alegando, preliminarmente, que: não deve ser aplicado o Código de Defesa do Consumidor; a demanda foi proposta em foro incompetente; é admissível a celebração do negócio por pessoa preposta da contratante, ainda que esta não figure no seu contrato social ou mesmo seja destituída de poderes especiais para contratar em nome da pessoa jurídica, consubstanciado na Teoria da Aparência; a funcionária da empresa autora se apresentou como gerente da empresa, assinou o contrato, concordando com as cláusulas descritas; o contrato foi firmado, no valor de 12 parcelas de R$ 350,00, correspondente a 3 edições (anos de 2023, 2024 e 2025), no valor total de R$ 4.200,00; está evidente o arrependimento tardio e injustificado da autora, com a contratação dos serviços prestados pela requerida; a requerida cumpriu de imediato com as obrigações assumidas contratualmente, inscrevendo os dados da empresa do autor em seu site comercial, ocasião em que passou a desfrutar dos benefícios da veiculação; ainda que seja reconhecida a nulidade do contrato, não há que se falar em indenização por danos morais, já que não houve qualquer apontamento ilegal no nome da autora junto aos órgãos de proteção ao crédito. Houve réplica (fls. 76/85). O feito foi saneado (fls. 458). Em audiência de instrução, foi inquirida uma testemunha arrolada pela autora (fls. 522). As partes apresentaram alegações finais (fls. 526/538 e 539/542).","SENTENÇA Processo Digital nº: 1014723-98.2023.8.26.0196 Classe - Assunto Procedimento Comum Cível - Indenização por Dano Moral Requerente: Farmácia de Manipulação Masini Ltda Requerido: A R de Araújo Comunicações Tramitação prioritária Juiz(a) de Direito: Dr(a). Adriana Gatto Martins Bonemer Vistos. FARMÁCIA DE MANIPULAÇÃO MASINI LTDA ajuizou ação em face de A. R. DE ARAÚJO COMUNICAÇÕES alegando, em síntese, que: em 25/04/2023, a requerida entrou em contato com a empresa autora, oferecendo serviços de publicidade digital; a requerida conversou com a funcionária da autora, VALÉRIA, que não detém poderes para representá-la, mas que firmou a contratação; a representante da empresa autora, REGINA MÁRCIA, só teve ciência da contratação, após o recebimento do boleto de cobrança; a autora entrou em contato com a requerida, explicando o ocorrido, mas a requerida exigiu o pagamento de multa pela rescisão contratual; o contrato está eivado de vício, já que assinado por pessoa que não possui legitimidade para representar a autora; o boleto em nome da autora foi protestado; a requerida, ao incluir o nome da autora no rol de inadimplentes, em virtude de débito inexistente, violou o direito da autora, causando dano moral que deverá ser indenizado. Requereu a procedência da ação, declarando-se a inexigibilidade da dívida, com a anulação do contrato e o cancelamento do protesto; a condenação da requerida ao pagamento de indenização por danos morais, no valor de R$ 15.000,00. Foi concedida tutela provisória de urgência (f r destinatária final de hipotética prestação de serviços, devendo ser reconhecida a relação de consumo.",null,null,"SENTENÇA Processo Digital nº: 1041299-20.2022.8.26.0114 Classe - Assunto Procedimento Comum Cível - Indenização por Dano Material Requerente: Aço Nobre Industria Ltda Requerido: Guia Plus A R Araujo Comunicações Me Juíza de Direito: Dra. Euzy Lopes Feijó Liberatti Vistos. AÇO NOBRE INDÚSTRIA LTDA. ajuizou ação em face de A R DE ARAÚJO COMUNICAÇÕES – GUIA PLUS, pretendendo a condenação da ré ao ressarcimento dobrado do valor pago indevidamente, de R$ 6.384,00, bem como á indenização por dano moral, no montante de R$ 6.384,00, uma vez que sofreu o golpe da lista telefônica, em que é solicitado a atualização/preenchimento de dados cadastrais, sendo informada a ausência de custos, recebendo, após, cobrança por serviços não contratados. Contestação, na qual alega incompetência territorial, validade do contrato e prestação dos serviços, inscrevendo os dados da autora em seu site comercial; o contrato tem valor de R$ 12.600,00 e somente houve o distrato da primeira edição, restando duas edições vigentes, de R$ 8.400,00; o contrato foi lido e assinado. Houve réplica. Produzida prova oral. Ofertado memorial somente pela autora.","SENTENÇA Processo Digital nº: 1041299-20.2022.8.26.0114 Classe - Assunto Procedimento Comum Cível - Indenização por Dano Material Requerente: Aço Nobre Industria Ltda Requerido: Guia Plus A R Araujo Comunicações Me Juíza de Direito: Dra. Euzy Lopes Feijó Liberatti Vistos. AÇO NOBRE INDÚSTRIA LTDA. ajuizou ação em face de A R DE ARAÚJO COMUNICAÇÕES – GUIA PLUS, pretendendo a condenação da ré ao ressarcimento dobrado do valor pago indevidamente, de R$ 6.384,00, bem como á indenização por dano moral, no montante de R$ 6.384,00, uma vez que sofreu o golpe da lista telefônica, em que é solicitado a atualização/preenchimento de dados cadastrais, sendo informada a ausência de custos, recebendo, após, cobrança por serviços não contratados. Contestação, na qual alega incompetência territorial, validade do contrato e prestação dos serviços, inscrevendo os dados da autora em seu site comercial; o contrato tem valor de R$ 12.600,00 e somente houve o distrato da primeira edição, restando duas edições vigentes, de R$ 8.400,00; o contrato foi lido e assinado. Houve réplica. Produzida prova oral. Ofertado memorial somente pela autora.","SENTENÇA Processo nº: 1047828-43.2022.8.26.0506 Classe - Assunto Procedimento Comum Cível - Práticas Abusivas Requerente: V & S Comércio de Veículos Ltda. Requerido: A R de Araujo Comunicações Me Juiz(a) de Direito: Dr(a). Francisco Camara Marques Pereira VISTOS ETC. V & S COMÉRCIO DE VEÍCULOS LTDA. ajuizou a presente Ação Declaratória c/c Indenização contra A R DE ARAÚJO COMUNICAÇÕES ME, aduzindo que em fevereiro de 2022, um preposto da ré ofertou a atualização do cadastro da empresa autora em “lista telefônica” oficial, dizendo na ocasião que inexistiria custo algum para tanto. Na ocasião, referido preposto colheu assinatura de um funcionário da autora em contrato com objeto diverso, contendo obrigação de pagar, em letras miúdas, sendo certo que tal funcionário não possuía poderes de administração e não poderia assumir responsabilidade em nome da empresa. Aduz que se tratou de um golpe, pois a ré atuou de má-fé para lograr contratar, tornando nulo o pactuado. Sustenta ter sofrido danos morais em razão do protesto de titulo de crédito sacado pela ré de forma ilegítima. Pretende, ao final, a tutela de urgência para sustação dos efeitos do protesto, julgando-se procedente a ação para declarar a inexistência de relação jurídica entre as partes e condenar a ré no pagamento de indenização por danos morais no importe de R$10.000,00. Concedida a tutela de urgência (págs. 59/60), a ré foi devidamente citada e apresentou contestação, alegando, preliminarmente, incompetência. No mérito, argumentou sobre a validade da contratação, pois o pacto foi devidamente firmado pela autora, através de um representante de nome Saulo, que se apresentou como gerente e não negou possuir poderes de representação. Invoca a Teoria da Aparência e aduz que os serviços foram prestados, devendo ser remunerada. Impugna a pretensão de preparação de danos morais e requer, ao final, a improcedência da ação. Seguiu-se réplica a págs. 100/106.","SENTENÇA Processo nº: 1047828-43.2022.8.26.0506 Classe - Assunto Procedimento Comum Cível - Práticas Abusivas Requerente: V & S Comércio de Veículos Ltda. Requerido: A R de Araujo Comunicações Me Juiz(a) de Direito: Dr(a). Francisco Camara Marques Pereira VISTOS ETC. V & S COMÉRCIO DE VEÍCULOS LTDA. ajuizou a presente Ação Declaratória c/c Indenização contra A R DE ARAÚJO COMUNICAÇÕES ME, aduzindo que em fevereiro de 2022, um preposto da ré ofertou a atualização do cadastro da empresa autora em “lista telefônica” oficial, dizendo na ocasião que inexistiria custo algum para tanto. Na ocasião, referido preposto colheu assinatura de um funcionário da autora em contrato com objeto diverso, contendo obrigação de pagar, em letras miúdas, sendo certo que tal funcionário não possuía poderes de administração e não poderia assumir responsabilidade em nome da empresa. Aduz que se tratou de um golpe, pois a ré atuou de má-fé para lograr contratar, tornando nulo o pactuado. Sustenta ter sofrido danos morais em razão do protesto de titulo de crédito sacado pela ré de forma ilegítima. Pretende, ao final, a tutela de urgência para sustação dos efeitos do protesto, julgando-se procedente a ação para declarar a inexistência de relação jurídica entre as partes e condenar a ré no pagamento de indenização por danos morais no importe de R$10.000,00. Concedida a tutela de urgência (págs. 59/60), a ré foi devidamente citada e apresentou contestação, alegando, preliminarmente, incompetência. No mérito, argumentou sobre a validade da contratação, pois o pacto foi devidamente firmado pela autora, através de um representante de nome Saulo, que se apresentou como gerente e não negou possuir poderes de representação. Invoca a Teoria da Aparência e aduz que os serviços foram prestados, devendo ser remunerada. Impugna a pretensão de preparação de danos morais e requer, ao final, a improcedência da ação. Seguiu-se réplica a págs. 100/106.","SENTENÇA Processo Digital nº: 1047828-43.2022.8.26.0506 Classe - Assunto Procedimento Comum Cível - Práticas Abusivas Requerente: V & S Comércio de Veículos Ltda. Requerido: A R de Araujo Comunicações Me Juiz(a) de Direito: Dr(a). Elaine Faria Evaristo Vistos. V & S COMÉRCIO DE VEÍCULOS LTDA. ajuizou a presente ação declaratória em face de A R DE ARAÚJO COMUNICAÇÕES ME, alegando que preposto da ré teria comparecido ao estabelecimento da autora sob o pretexto de atualizar a lista de cadastro, pedindo que o funcionário da ré Saulo assinasse o termo de atualização de cadastro. Naquela ocasião, foi-lhe dito que não haveria qualquer custo para a autora. Na mesma oportunidade, o funcionário da autora foi levado a preencher e assinar um Contrato de Figuração, que estabelecia a remuneração de R$ 350,00 a serem pagos em 12 parcelas pela contratação de anúncios via web. Aponta que o funcionário em questão não teria poderes para tanto, sendo o contrato em questão nulo de pleno direito. Posteriormente, a autora foi surpreendida com Aviso de Protesto, sofrendo prejuízos em razão do apontamento indevido em seu nome. Alega que a conduta reiterada da requerida deu causa ao ingresso de mais de 150 ações congêneres, todas reclamando o reconhecimento de inexistência de relação jurídica. Assim, pleiteou a suspensão dos efeitos do protesto, determinando-se que a requerida se abstenha de negativar o nome da autora, com o pagamento de indenização por danos morais na importância de R$ 10.000,00. Citada, a ré apresentou contestação, em que levantou preliminar de incompetência territorial, uma vez que não se trataria de uma relação de consumo, já que a autora não figura como destinatária final. Alegou que a teoria da aparência é aplicada ao presente litígio, uma vez que a parte teria expressamente consentido com a contratação, bem como indica a prestação destes serviços, sendo legítima a cobrança. Impugna a alegação de que os serviços seriam gratuitos, sustentando que a autora apenas se arrependeu da contratação. Houve réplica (fls. 100/106). Proferida sentença de procedência da ação, foi interposta apelação, a qual anulou a sentença por reconhecer a incompetência do juízo do Foro de Ribeirão Preto. Já neste Juízo, foi realizada audiência de instrução e julgamento, na qual as partes tiveram oportunidade de se manifestar em debates orais.","SENTENÇA Processo Digital nº: 1074905-81.2022.8.26.0100 Classe - Assunto Procedimento Comum Cível - Defeito, nulidade ou anulação Requerente: Racões & Cia - Nogueira & Bertozzi Comércio de Rações Ltda - Me Requerido: A R de Araújo Comunicações Me (Guia Plus) Juiz(a) de Direito: Dr(a). Antonio Carlos de Figueiredo Negreiros Vistos. NOGUEIRA & BERTOZZI COMÉRCIO DE RAÇÕES LTDA. Ajuizou ação de rescisão contratual cumulada com declaratória de inexigibilidade em face de A R DE ARAÚJO COMUNICAÇÕES ME (GUIA PLUS). Afirma que em junho de 2022 recebeu um telefonema da requerida, solicitando dados da empresa para que permanecessem constando na “lista telefônica virtual”; durante o telefonema, a requerida afirmou que é uma empresa conveniada com a VIVO S/A e que, por esta razão, viria uma cobrança de, aproximadamente, R$ 15,00 (quinze reais) mensais, em cada fatura da empresa de telefonia ora mencionada; que acreditando na boa-fé do profissional, a requerente forneceu os dados básicos para a suposta atualização; que, com esses dados, a requerida preencheu um documento denominado “Contrato de Figuração” e submeteu à assinatura do requerente; que no documento em questão não constava nenhum valor a ser pago pela requerente, deixando os campos “condições de pagamento por edição” e “valor mensal” em branco; a requerente assinou o documento recebido, acreditando ser um formulário para a simples atualização dos dados da empresa e, ato contínuo, o encaminhou ao e-mail indicado pela demandada, a fim de efetivar a atualização dos cadastros. Ocorre que após alguns dias recebeu em seu e-mail um boleto para pagamento do valor de R$350,00 (trezentos e cinquenta reais), acompanhado da cópia do respectivo contrato com informações preenchidas após a sua assinatura; ao observar o contrato recebido, o requerente notou que a requerida fez constar que o mesmo estaria aderindo a uma “publicidade virtual” e que para isso, teria que pagar a quantia anual de R$ 4.200,00 (quatro mil e duzentos reais) através de 12 (doze) parcelas fixas no valor de R$ 350,00 (trezentos e cinquenta reais), durante o período de três anos, totalizando, portanto, a quantia de R$ 12.600,00 (doze mil e seiscentos reais). Ocorre que a requerente não celebrou nenhum contrato com a requerida, assim, esta deixou de observar os ditames da boa-fé objetiva, uma vez que usou de informações falsas e infundadas para convencer a requerente sobre uma suposta “atualização de dados”. Que após os fatos, descobriu a existência de inúmeros casos iguais aos seu relacionados à requerida, que aplica o denominado \"golpe da lista telefônica\". Requer seja declarada a rescisão do Contrato de Figuração nº 96825-G, datado de 14/06/2022, sem qualquer ônus à requerente, bem como para declarar inexigíveis quaisquer valores oriundos de tal instrumento, confirmando-se as medidas concedidas em caráter liminar. Juntou documentos (pp. 15/36). A tutela de urgência foi deferida (p. 37). A ré foi citada e apresentou contestação (pp. 49/61). Preliminarmente, arguiu incompetência territorial ante a inaplicabilidade do CDC. No mérito, pugnou pela improcedência, sob a alegação de que o contrato é válido e foi assinado pelo representante da empresa; que houve a prestação de serviços, com a divulgação da empresa requerente em seu site, fazendo jus à remuneração. Juntou documentos (pp. 62/71). A parte autora se manifestou em réplica (p. 75/81). Determinada a especificação de provas, a parte autora dispensou a produção de outras provas (p. 85) e a ré não se manifestou (p. 86).",null],[", nos termos do art. 38 da LJE. Decido. Trata-se de pleito declaratório de inexistência de débito sob a afirmação de que teria a parte requerida remetido o nome da empresa autora aos cadastros restritivos de crédito por dívida inexistência, eis que ausente relação jurídica entre as partes, conforme alegado. Julgo antecipadamente o feito, nos termos do artigo 355, inciso I do Código de Processo Civil, tendo em vista que a lide, embora envolva matéria de fato e de direito, não carece da produção de outras provas. Ademais, a documentação colacionada é suficiente para o deslinde dos fatos. Com efeito, os documentos apresentados pelas partes, com a inicial e contestação, permitem o deslinde da causa. De tal sorte, “Presentes as condições que ensejam o julgamento antecipado da causa, é dever do juiz, e não mera faculdade, assim proceder” (STJ, 4ª T., REsp. 2.832 RJ, rel. Min. Sálvio de Figueiredo, j. 14.8.90, DJU 17.9.90, p. 9.513; no mesmo sentido, RSTJ 102/500 e RT 782/302). Verifico presentes todos os requisitos previstos pelos artigos 319 e 320, ambos do Código de Processo Civil. Os fatos foram narrados de forma clara, acompanhando a exordial os documentos entendidos como essenciais ao deslinde da demanda. E evidente o interesse de agir da parte, certo que o livre acesso ao Judiciário é prerrogativa constitucionalmente assegurada ao cidadão. De proêmio, cumpre ressaltar que não se aplica ao caso a legislação consumerista, haja vista a reclamação inicial para fins de indenização moral para a parte autora, pessoa jurídica, em face dos serviços prestados à empresa requerente. Nesse sentido, aliás, o posicionamento do E. Superior Tribunal de Justiça: “CONSUMIDOR. DEFINIÇÃO. ALCANCE. TEORIA FINALISTA. REGRA. MITIGAÇÃO. FINALISMO APROFUNDADO. CONSUMIDOR POR EQUIPARAÇÃO. VULNERABILIDADE. 1. A jurisprudência do STJ se encontra consolidada no sentido de que a determinação da qualidade de consumidor deve, em regra, ser feita mediante aplicação da teoria finalista, que, numa exegese restritiva do art. 2º do CDC, considera destinatário final tão somente o destinatário fático e econômico do bem ou serviço, seja ele pessoa física ou jurídica. 2. Pela teoria finalista, fica excluído da proteção do CDC o consumo intermediário, assim entendido como aquele cujo produto retorna para as cadeias de produção e distribuição, compondo o custo (e, portanto, o preço final) de um novo bem ou serviço. Vale dizer, só pode ser considerado consumidor, para fins de tutela pela Lei nº 8.078/90, aquele que exaure a função econômica do bem ou serviço, excluindo-o de forma definitiva do mercado de consumo. 3. A jurisprudência do STJ, tomando por base o conceito de consumidor por equiparação previsto no art. 29 do CDC, tem evoluído para uma aplicação temperada da teoria finalista frente às pessoas jurídicas, num processo que a doutrina vem denominando finalismo aprofundado, consistente em se admitir que, em determinadas hipóteses, a pessoa jurídica adquirente de um produto ou serviço pode ser equiparada à condição de consumidora, por apresentar frente ao fornecedor alguma vulnerabilidade, que constitui o princípio-motor da política nacional das relações de consumo, premissa expressamente fixada no art. 4º, I, do CDC, que legitima toda a proteção conferida ao consumidor. 4. A doutrina tradicionalmente aponta a existência de três modalidades de vulnerabilidade: técnica (ausência de conhecimento específico acerca do produto ou serviço objeto de consumo), jurídica (falta de conhecimento jurídico, contábil ou econômico e de seus reflexos na relação de consumo) e fática (situações em que a insuficiência econômica, física ou até mesmo psicológica do consumidor o coloca em pé de desigualdade frente ao fornecedor). Mais recentemente, tem se incluído também a vulnerabilidade informacional (dados insuficientes sobre o produto ou serviço capazes de influenciar no processo decisório de compra). 5. A despeito da identificação in abstracto dessas espécies de vulnerabilidade, a casuística poderá apresentar novas formas de vulnerabilidade aptas a atrair a incidência do CDC à relação de consumo. Numa relação interempresarial, para além das hipóteses de vulnerabilidade já consagradas pela doutrina e pela jurisprudência, a relação de dependência de uma das partes frente à outra pode, conforme o caso, caracterizar uma vulnerabilidade legitimadora da aplicação da Lei nº 8.078/90, mitigando os rigores da teoria finalista e autorizando a equiparação da pessoa jurídica compradora à condição de consumidora. 6. Hipótese em que revendedora de veículos reclama indenização por danos materiais derivados de defeito em suas linhas telefônicas, tornando inócuo o investimento em anúncios publicitários, dada a impossibilidade de atender ligações de potenciais clientes. A contratação do serviço de telefonia não caracteriza relação de consumo tutelável pelo CDC, pois o referido serviço compõe a cadeia produtiva da empresa, sendo essencial à consecução do seu negócio. Também não se verifica nenhuma vulnerabilidade apta a equipar a empresa à condição de consumidora frente à prestadora do serviço de telefonia. Ainda assim, mediante aplicação do direito à espécie, nos termos do art. 257 do RISTJ, fica mantida a condenação imposta a título de danos materiais, à luz dos arts. 186 e 927 do CC/02 e tendo em vista a conclusão das instâncias ordinárias quanto à existência de culpa da fornecedora pelo defeito apresentado nas linhas telefônicas e a relação direta deste defeito com os prejuízos suportados pela revendedora de veículos. 7. Recurso especial a que se nega provimento.” (REsp 1195642/RJ, Rel. Ministra NANCY ANDRIGHI, TERCEIRA TURMA, julgado em 13/11/2012, DJe 21/11/2012). Na espécie, apesar do dito em contestação, não há prova clara de que teria a empresa autora anuído à prestação de serviços referenciada (anúncio site). O documento trazido aos autos indica assinatura de terceira pessoa, sem vínculo notório com a empresa requerida, muito menos de que possuía poderes para tanto. Ademais, a parte ré não comprovou a perfeita prestação dos serviços assinaladas. Deste modo, não há sustento para o débito em desfavor da empresa, restando irregular o apontamento negativo. De rigor, pois, a procedência do pleito. Pelo exposto,","SENTENÇA pagamento – conhecimento - dm Processo nº: 0001671-88.2025.8.26.0032 Classe Procedimento do Juizado Especial Cível Assunto: Protesto Indevido de Título Requerente: PASSOS E PASSOS LOCAÇÃO PARA EVENTOS LTDA - ME Requerido: Lista Regional Brasil – A. R. de Araújo Comunicações Me Juiz de Direito: Dr. MARCELO YUKIO MISAKA Vistos. Diante do integral cumprimento da obrigação,",null,null,null,"SENTENÇA DE EXTINÇÃO Reclamação: 0007213-90.2019.8.26.0196 Requerente: A.L.V DE ALMEIDA PEÇAS Requerido: A R DE ARAÚJO COMUNICAÇÕES (Lista Regional Brasil) Vistos. 1 - Ante o teor da certidão retro e a concordância tácita do(a) autor(a),",null,"SENTENÇA Processo Digital nº: 0013492-90.2021.8.26.0562 Classe - Assunto Cumprimento de sentença - Rescisão do contrato e devolução do dinheiro Exequente: ANDRADE E VIEIRA RESTAURANTE NORDESTINO LTDA Executado: A. R de Araújo Comunicações – Me Juiz(a) de Direito: Dr(a). José Wilson Gonçalves Vistos. Considerando que foi cumprida a obrigação que era exigida do devedor nestes autos,",null,"SENTENÇA Processo nº: 0013541-97.2022.8.26.0562 Classe - Assunto Cumprimento de sentença - Defeito, nulidade ou anulação Exequente: Wr Soluções Industriais e Navais Ltda Epp Executado: A. R. de Araújo Comunicações Me. -Lista Regional Brasil Juiz(a) de Direito: Dr(a). Daniel Ribeiro de Paula Vistos. A atual situação dos autos não deixa dúvidas com relação à quitação do débito, motivo pelo qual, desde logo,","SENTENÇA Processo nº: 0044471-29.2022.8.26.0100 Classe - Assunto Cumprimento de sentença - Rescisão / Resolução Exequente: Palmira & Braga Auto Center Ltda Executado: A R de Araújo Comunicações Me - Guia Plus Juiz(a) de Direito: Dr(a). Lúcia Caninéo Campanhã Vistos. Fls. 126/128: Trata-se de impugnação ao cumprimento de sentença em que a executada alega já ter realizado o pagamento do débito aqui cobrado, conforme depósito realizado a fls. 103/104 dos autos principais. Aduz a executada que foi condenada a arcar com custas e taxas processuais, bem como os honorários advocatícios. Por outro lado, a exequente incluiu na planilha de cálculo (fls. 4/5) os valores anteriormente desembolsados em relação às parcelas pagas do contrato rescindido. Com razão o impugnante. Constou expressamente da sentença: JULGO PROCEDENTE o pedido, confirmando a tutela deferida, para rescindir o negócio jurídico e declarar a inexigibilidade das parcelas vencidas e vincendas decorrentes do Contrato de Figuração nº 87997G. Arcará a ré com o pagamento das custas, despesas processuais e honorários advocatícios, que fixo em 15% do valor atribuído à causa. Assim, não devem ser incluídos no cálculo os valores referentes às parcelas, observando-se que não houve pedido de devolução dos valores pagos nem consta condenação nesse sentido. Assim, ACOLHO a impugnação para que sejam excluídos os valores referentes às parcelas, sendo devido o valor de R$ 682,40 (soma das custas, despesas processuais e honorários advocatícios). Por fim, considerando o depósito efetuado nos autos principais,","SENTENÇA Processo nº: 0044471-29.2022.8.26.0100 Classe - Assunto Cumprimento de sentença - Rescisão / Resolução Exequente: Palmira & Braga Auto Center Ltda Executado: A R de Araújo Comunicações Me - Guia Plus Juiz(a) de Direito: Dr(a). Lúcia Caninéo Campanhã. Vistos. Diante da satisfação da obrigação,",". Pretende o autor obter a resilição do contrato firmado entre as partes com a condenação da requerida ao reembolso da quantia de R$290,00 e o pagamento de indenização por danos morais no valor de R$5.000,00. A ação é parcialmente procedente. Com efeito, no presente caso, restou incontroverso nos autos que as partes celebraram negócio jurídico para prestação de serviço de publicidade em lista telefônica representado pelos documentos de fls. 20/21 e 88/91, devidamente assinados pela representante do autor, fato que não foi negado por ele negado. E, da análise dos referidos documentos, se denota que deles, expressamente, se observa que o serviço contratado não era gratuito, pois, além de indicar o prazo de validade da avença e o valor das parcelas, é clara a autorização do débito em ficha de compensação bancária ou contas telefônicas e, ainda, a possibilidade de reajuste dos valores, não podendo a autora deles alegar desconhecimento. Por outro lado, também deles consta a possibilidade de cancelamento em sete dias úteis a contar da data da assinatura da avença, que esta datada de 03/07/2018 (fls. 20), sendo certo, neste particular, que o documento de fls. 22, de mesma data, trazido aos autos pela autora, constitui prova de que tal opção de cancelamento foi por ela exercida dentro do prazo estipulado, via email, que deve ser reconhecida como proposta de rescisão contratual, com exoneração do devedor dos pagamentos derivados do contrato em questão. Desse modo, rescindido o contrato em questão, não se justifica as exigências de valores pela requerida, devendo ser-lhe ressarcido o valor despendido e cessadas as cobranças advindas do contrato, afastando qualquer razão à requerida quanto ao pedido contraposto formulado. Portanto, deve ser acolhido o pedido de rescisão contratual, com declaração de inexigibilidade das parcelas indicadas no contrato. Quanto à pretensão de indenização a título de danos morais, melhor sorte não socorre ao postulante. É sabido que dano moral é a lesão a um bem extrapatrimonial contido nos direitos da personalidade ou nos atributos da pessoa, e não decorrem, necessariamente, de todo e qualquer aborrecimento, sendo de rigor a identificação de uma dor que ultrapassa aquela imposta pela vida cotidiana, o que não se vislumbra neste caso. Nesse sentido, não há como enumerar exaustivamente os aspectos que evidenciam um dano moral, como a dor de um pai pela perda do filho, a humilhação pública que uma pessoa pode passar, o devassamento da privacidade. Todavia, é necessário tomar cuidado para que o alargamento do conceito de dano moral não acabe por distorcer a verdadeira finalidade de reparação do dano. A propósito afirma Carlos Roberto Gonçalves citando Sérgio Cavalieri:\"(...) só se deve reputar como dano moral a dor, vexame, sofrimento ou humilhação que, fugindo à normalidade, interfira imensamente no comportamento psicológico do indivíduo, causando-lhe aflições, angústia e desequilíbrio em seu bem estar. Mero dissabor, aborrecimento, mágoa, irritação ou sensibilidade exacerbada estão fora da órbita do dano moral, porquanto, além de fazerem parte da normalidade do nosso dia-a-dia, no trabalho, no trânsito, entre os amigos e até no ambiente familiar, tais situações não são intensas e duradouras, a ponto de romper o equilíbrio psicológico do indivíduo” (Responsabilidade civil, 11ª ed., p. 616). No caso, ainda que reconhecido o ventilado abuso da requerida com as alegadas reiteradas e incisivas cobranças, não se comprovou tenham elas extrapolado o limite a ponto de ensejar reparação patrimonial ao autor, como pretendido. No caso em tela, é certo que ocorreu uma situação desagradável para o autor, mas não houve comprovação de qualquer ofensa que pudesse ferir a sua imagem e honra, capaz de gerar um dano moral. Ressalto que o nome do autor não foi inscrito nos cadastros de inadimplentes dos órgãos de proteção ao crédito e não houve qualquer infortúnio mais grave em sua vida, pelo menos disso não há prova nos autos. Os fatos ocorridos estão incluídos nos percalços da vida, tratando-se de meros dissabores e aborrecimentos que qualquer pessoa pode, um dia, infelizmente passar. Não houve abalo à honra do autor, que também não passou por situação de dor, sofrimento ou humilhação. Não se vislumbra, portanto, a hipótese de indenização por danos morais. Ante ao exposto, JULGO PARCIALMENTE PROCEDENTE a ação ajuizada por WILSON REIS ALVES-ME em face de A R DE ARAÚJO COMUNICAÇÕES ME-GUIA PLUS, para a) declarar a resilição do contrato firmado entre as partes, retornando-as ao “status quo ante” e inexigíveis os valores do contrato decorrentes e b) condenar a requerida ao reembolso ao autor da quantia de R$290,00, a ser corrigida pela Tabela Prática do Tribunal de Justiça- TPTJ e acrescida de juros de mora de 1% ao mês, deste a data da citação. Em consequência,","SENTENÇA Processo nº: 1000544-36.2019.8.26.0638 Classe – Assunto: Procedimento do Juizado Especial Cível - Espécies de Contratos Requerente: Wilson Reis Alves - Me Requerido: A R de Araújo Comunicações - Me (Guia Plus Comunicações) MM. Juiz de Direito Dr. Moisés Harley Alves Coutinho Oliveira Vistos. 1- Ante as manifestações de fls. 120 e 125,",". 2. É caso de julgamento antecipado nos termos do artigo 355, I, do CPC, pois ambas as partes não demonstraram interesse na produção de outras provas. No mérito, os pedidos são procedentes em parte. Narra a parte autora que houve defeito na prestação do serviço, caracterizado pelas informações incorretas, contratação de má-fé, e cobranças abusivas. A legislação consumerista estabeleceu a responsabilidade objetiva do fornecedor de produtos ou serviços, ou seja, a espécie de responsabilidade em que não é necessária a perquirição acerca da presença de dolo ou culpa por parte do agente. O questionamento cinge-se a existência de dano e de nexo de causalidade, responsabilizando-se o agente sempre que presentes, salvo se existente eventual causa excludente de responsabilidade. De fato, dispõe o art. 14, do Código de Defesa do Consumidor, que: “O fornecedor de serviços responde, independentemente da existência de culpa, pela reparação dos danos causados aos consumidores por defeitos relativos à prestação de serviços, bem como por informações insuficientes ou inadequadas sobre sua fruição e riscos”. Como se vê, a responsabilidade civil, nas relações de consumo, “...se aperfeiçoa mediante o concurso de três pressupostos: a) defeito do serviço; b) evento danoso; c) relação de causalidade entre o defeito do serviço e o dano” (GRINOVER, Ada Pellegrini; BENJAMIN, Antônio Herman de Vasconcellos e; FINK, Daniel Roberto et. alli. Código brasileiro de defesa do consumidor. 2. ed. Rio de Janeiro: Forense Universitária, 1992. p. 93). No caso vertente, todos esses requisitos estão presentes. No que tange ao defeito na prestação do serviço, as provas indicam que funcionária (Ana Fernanda Takahashi) da autora SEA Peças Ltda., foi induzida ao preenchimento de formulário de atualização cadastral, que na verdade era “Contrato de Figuração”, e com cláusulas obscuras. Não restou comprovado que a Ana Fernanda Takahashi possuía poderes para contratar em nome da autora SEA Peças Ltda., que devia ter requerido a comprovação de que a coautora possuía tais poderes, não cabendo, no caso concreto, a alegação de Teoria da Aparência, por parte da requerida, uma vez que restam claros os indícios de fraude, ainda mais considerando que a requerida trata-se de empresa especializada em publicidade, não podendo alegar desconhecimento de tal exigência. Nesse sentido, já decidiu o Egrégio Tribunal de Justiça do Estado de São Paulo, em demandas idênticas, contra a mesma empresa ora requerida: APELAÇÃO. Ação declaratória de inexigibilidade de débito. Prestação de serviços. Publicidade em lista telefônica. Funcionária da empresa autora que preencheu formulário convencida de que se tratava de mera atualização cadastral. Formulário que se tratava de \"Contrato de Figuração\". Objeto contratual que não é descrito de forma clara e objetiva. Contrato que não prevê expressamente o valor do serviço prestado. Ausência de efetiva prestação do serviço de edição. Assinatura lançada por funcionário sem poderes de representação. Contratada que não exigiu documento comprobatório da existência de poderes de representação. Teoria da aparência que pode ser afastada ante os indícios da ocorrência do \"Golpe da lista telefônica\". Declaração de inexigibilidade do débito que deve ser mantida. Dano moral. Ocorrência. Pessoa jurídica que pode sofrer dano moral, nos termos da Súmula 227 do STJ. Ofensa à honra objetiva. Protesto indevido que constitui dano in re ipsa. Quantum indenizatório fixado em R$ 8.000,00. Adequação aos princípios da razoabilidade e proporcionalidade. Sentença mantida. Recurso não provido. (TJSP; Apelação Cível 1010878-98.2023.8.26.0506; Relator (a): Pedro Paulo Maillet Preuss; Órgão Julgador: 24ª Câmara de Direito Privado; Foro de Ribeirão Preto - 1ª Vara Cível; Data do Julgamento: 21/05/2024; Data de Registro: 21/05/2024) APELAÇÃO AÇÃO DECLARATÓRIA DE NULIDADE CONTRATUAL C/C INDENIZATÓRIA CONTRATO DE PRESTAÇÃO DE SERVIÇOS DE PUBLICIDADE EM SÍTIO ELETRÔNICO Instrumento subscrito por empregado sem poderes de representação Nulidade do negócio entabulado TEORIA DA APARÊNCIA Inaplicabilidade Inescusável a conduta da empresa demandada que adota \"modus operandi\" negligente e sabidamente falho, encaminhando proposta sucinta, sem dispensar qualquer cuidado com a pessoa que a recebe ou explicitar os termos da pretensa contratação, procedimento incompatível com a boa-fé objetiva (artigos 113, 187 e 422 do CC) Empresa especializada no ramo, afastando presunção de boa-fé subjetiva DANOS MORAIS Configuração Nos casos de protesto indevido, o dano moral se configura \"in re ipsa\", ainda que se trate de pessoa jurídica Precedentes do Superior Tribunal de Justiça \"QUANTUM\" INDENIZATÓRIO Indenização arbitrada em R$ 10.000,00 que, diante das circunstâncias do caso, se mostra adequada para sanar de forma justa a lide, atendendo aos princípios da razoabilidade e proporcionalidade Negado provimento. (TJSP; Apelação Cível 1134862-13.2022.8.26.0100; Relator (a): Hugo Crepaldi; Órgão Julgador: 25ª Câmara de Direito Privado; Foro Central Cível - 37ª Vara Cível; Data do Julgamento: 09/01/2024; Data de Registro: 09/01/2024) Assim, é de rigor a declaração de inexistência de relação jurídica entre a parte autora e a parte ré e de inexigibilidade dos títulos extraídos com base no \"contrato de de figuração\" n. 93631. Quanto ao pedido de danos morais, prescreve o art. 52 do Código Civil que se aplica às pessoas jurídicas, no que couber, a proteção dos direitos da personalidade. Ademais, conforme enunciado da Súmula 227,do C. Superior Tribunal de Justiça, “a pessoa jurídica pode sofrer dano moral”. No caso concreto, a autora, pessoa jurídica, teve seu nome indevidamente protestado (fls. 30), o que compromete a sua reputação perante seus fornecedores e o mercado em geral, atingindo, assim, a sua honra objetiva. Neste aspecto, já decidiu o E. Tribunal de Justiça do Estado de São Paulo: EMENTA: “PRESTAÇÃO DE SERVIÇOS DE TELEFONIA. AÇÃO DECLARATÓRIA DE INEXIGIBILIDADE DE DÉBITO CUMULADA COM AÇÃO DE INDENIZAÇÃO POR DANOS MORAIS. Inclusão do nome da empresa autora na lista de órgãos de restrição ao crédito (SCPC/SERASA). Inexistência de prova de relação jurídica entre as partes. Dívida inexigível. Negativação indevida. Pessoa jurídica como sujeito passivo de dano moral. Plena admissibilidade, diante da existência de honra objetiva a ser tutelada, o que diz respeito à sua imagem, ao seu prestígio, ao respeito que goza no mercado por parte de seus clientes, fornecedores e consumidores em geral. Matéria que, a propósito, foi sumulada pelo Colendo Superior Tribunal de Justiça no Enunciado da Súmula 227. Indenização por danos morais arbitrada em R$ 8.000,00, com incidência de correção monetária desde a data deste Julgamento e de juros de mora de 1% ao mês, a partir do evento danoso (Súmula 54 do C. STJ). Sentença reformada. RECURSO PARCIALMENTE PROVIDO.” (Apelação nº 0028448-04.2012.8.26.0344 - 25ª Câmara de Direito Privado - Relator(a): Carmen Lúcia da Silva - Data do julgamento: 17/11/2016) A parte autora teve seu nome protestado indevidamente, o que caracteriza o dano in re ipsa. Nesse sentido, é o entendimento do E. Tribunal de Justiça do Estado de São Paulo: INEXISTÊNCIA DE RELAÇÃO JURÍDICA CUMULADA COM INDENIZAÇÃO POR DANO MORAL IRREGULARIDADE FORMAL DE SAQUE DE DUPLICATA MERCANTIL PROTESTO INDEVIDO DO TÍTULO PROCEDÊNCIA DANO MORAL CONFIGURADO PRETENSÃO DE REFORMA - DESCABIMENTO A duplicata é um título de crédito causal, que deve estar revestido de todas as formalidades impostas pela lei para sua constituição, sendo que a ré não comprovou a regularidade no saque da duplicata mercantil em causa. Abalo de crédito suportado pela autora com o envio de seu nome ao protesto por ato abusivo Dano moral in re ipsa Indenização por dano moral fixada em R$ 5.000,00, quantia que se mostra adequada ao caso. Recurso desprovido. (TJSP; Apelação 1003183-62.2015.8.26.0704; Relator (a): Walter Fonseca; Órgão Julgador: 11ª Câmara de Direito Privado; Foro Regional XV - Butantã - 2ª Vara Cível; Data do Julgamento: 13/09/2018; Data de Registro: 17/09/2018) Assim, configurada a responsabilidade e existente o dano, resta o dever de indenizar. Quanto à fixação do dano moral: \"Dano moral é o prejuízo que afeta o ânimo psíquico, moral e intelectual da vítima (...) Aqui também é importante o critério objetivo do homem médio, o bônus pater famílias: não se levará em conta o psiquismo do homem excessivamente sensível, que se aborrece com fatos diuturnos da vida, nem o homem de pouca ou nenhuma sensibilidade, capaz de resistir sempre às rudezas do destino. Nesse campo, não há fórmulas seguras para auxiliar o juiz. Cabe ao magistrado sentir em cada caso o pulsar da sociedade que o cerca\" (Sílvio de Salvo Venosa, Direito Civil: Responsabilidade Civil, Vol. IV, Ed. Atlas, p. 33). E ainda: \"Na fixação da indenização por danos morais, recomendável que o arbitramento seja feito com moderação, proporcionalidade ao grau de culpa, ao nível socioeconômico dos autores, e, ainda, ao porte da empresa recorrida, orientando-se o juiz pelos critérios sugeridos pela doutrina e pela jurisprudência, com razoabilidade, valendo-se de sua experiência e do bom senso, atento à realidade da vida e às peculiaridades de cada caso\" (RT 816/387). O montante do dano moral não pode ser inexpressivo ou caracterizado como donativo, nem ser motivo de enriquecimento súbito e exagerado, como premiação em sorteio, e deve possuir poder repressivo, inibidor e, por outro, formador de cultura ética mais elevada. Com isto, tendo em vista as atividades exercidas pelas partes, a gravidade do evento, as consequências do defeito na prestação de serviço para a parte autora, considerando-se ainda, os critérios de prudência e razoabilidade e o poder repressivo e formador, fixo o valor da indenização por danos morais em R$ 5.000,00 (cinco mil reais). 3. Ante o exposto, nos termos do artigo 487, inciso I, do Código de Processo Civil,",". 2. É caso de julgamento antecipado nos termos do artigo 355, I, do CPC, pois ambas as partes não demonstraram interesse na produção de outras provas. No mérito, os pedidos são procedentes em parte. Narra a parte autora que houve defeito na prestação do serviço, caracterizado pelas informações incorretas, contratação de má-fé, e cobranças abusivas. A legislação consumerista estabeleceu a responsabilidade objetiva do fornecedor de produtos ou serviços, ou seja, a espécie de responsabilidade em que não é necessária a perquirição acerca da presença de dolo ou culpa por parte do agente. O questionamento cinge-se a existência de dano e de nexo de causalidade, responsabilizando-se o agente sempre que presentes, salvo se existente eventual causa excludente de responsabilidade. De fato, dispõe o art. 14, do Código de Defesa do Consumidor, que: “O fornecedor de serviços responde, independentemente da existência de culpa, pela reparação dos danos causados aos consumidores por defeitos relativos à prestação de serviços, bem como por informações insuficie tral Cível - 37ª Vara Cível; Data do Julgamento: 09/01/2024; Data de Registro: 09/01/2024) Assim, é de rigor a declaração de inexistência de relação jurídica entre a parte autora e a parte ré e de inexigibilidade dos títulos extraídos com base no \"contrato de de figuração\" n. 93631. Quanto ao pedido de danos morais, prescreve o art. 52 do Código Civil que se aplica às pessoas jurídicas, no que couber, a proteção dos direitos da personalidade. Ademais, conforme enunciado da Súmula 227,do C. Superior Tribunal de Justiça, “a pessoa jurídica pode sofrer dano moral”. No caso concreto, a autora, pessoa jurídica, teve seu nome indevidamente protestado (fls. 30), o que compromete a sua reputação perante seus fornecedores e o mercado em geral, atingindo, assim, a sua honra objetiva. Neste aspecto, já decidiu o E. Tribunal de Justiça do Estado de São Paulo: EMENTA: “PRESTAÇÃO DE SERVIÇOS DE TELEFONIA. AÇÃO DECLARATÓRIA DE INEXIGIBILIDADE DE DÉBITO CUMULADA COM AÇÃO DE INDENIZAÇÃO POR DANOS MORAIS. Inclusão do nome da empresa autora na lista de órgãos de restrição ao crédito (SCPC/SERASA). Inexistência de prova de relação jurídica entre as partes. Dívida inexigível. Negativação indevida. Pessoa jurídica como sujeito passivo de dano moral. Plena admissibilidade, diante da existência de honra objetiva a ser tutelada, o que diz respeito à sua imagem, ao seu prestígio, ao respeito que goza no mercado por parte de seus clientes, fornecedores e consumidores em geral. Matéria que, a propósito, foi sumulada pelo Colendo Superior Tribunal de Justiça no Enunciado da Súmula 227. Indenização por danos morais arbitrada em R$ 8.000,00, com incidência de correção monetária desde a data deste Julgamento e de juros de mora de 1% ao mês, a partir do evento danoso (Súmula 54 do C. STJ). Sentença reformada. RECURSO PARCIALMENTE PROVIDO.” (Apelação nº 0028448-04.2012.8.26.0344 - 25ª Câmara de Direito Privado - Relator(a): Carmen Lúcia da Silva - Data do julgamento: 17/11/2016) A parte autora teve seu nome protestado indevidamente, o que caracteriza o dano in re ipsa. Nesse sentido, é o entendimento do E. Tribunal de Justiça do Estado de São Paulo: INEXISTÊNCIA DE RELAÇÃO JURÍDICA CUMULADA COM INDENIZAÇÃO POR DANO MORAL IRREGULARIDADE FORMAL DE SAQUE DE DUPLICATA MERCANTIL PROTESTO INDEVIDO DO TÍTULO PROCEDÊNCIA DANO MORAL CONFIGURADO PRETENSÃO DE REFORMA - DESCABIMENTO A duplicata é um título de crédito causal, que deve estar revestido de todas as formalidades impostas pela lei para sua constituição, sendo que a ré não comprovou a regularidade no saque da duplicata mercantil em causa. Abalo de crédito suportado pela autora com o envio de seu nome ao protesto por ato abusivo Dano moral in re ipsa Indenização por dano moral fixada em R$ 5.000,00, quantia que se mostra adequada ao caso. Recurso desprovido. (TJSP; Apelação 1003183-62.2015.8.26.0704; Relator (a): Walter Fonseca; Órgão Julgador: 11ª Câmara de Direito Privado; Foro Regional XV - Butantã - 2ª Vara Cível; Data do Julgamento: 13/09/2018; Data de Registro: 17/09/2018) Assim, configurada a responsabilidade e existente o dano, resta o dever de indenizar. Quanto à fixação do dano moral: \"Dano moral é o prejuízo que afeta o ânimo psíquico, moral e intelectual da vítima (...) Aqui também é importante o critério objetivo do homem médio, o bônus pater famílias: não se levará em conta o psiquismo do homem excessivamente sensível, que se aborrece com fatos diuturnos da vida, nem o homem de pouca ou nenhuma sensibilidade, capaz de resistir sempre às rudezas do destino. Nesse campo, não há fórmulas seguras para auxiliar o juiz. Cabe ao magistrado sentir em cada caso o pulsar da sociedade que o cerca\" (Sílvio de Salvo Venosa, Direito Civil: Responsabilidade Civil, Vol. IV, Ed. Atlas, p. 33). E ainda: \"Na fixação da indenização por danos morais, recomendável que o arbitramento seja feito com moderação, proporcionalidade ao grau de culpa, ao nível socioeconômico dos autores, e, ainda, ao porte da empresa recorrida, orientando-se o juiz pelos critérios sugeridos pela doutrina e pela jurisprudência, com razoabilidade, valendo-se de sua experiência e do bom senso, atento à realidade da vida e às peculiaridades de cada caso\" (RT 816/387). O montante do dano moral não pode ser inexpressivo ou caracterizado como donativo, nem ser motivo de enriquecimento súbito e exagerado, como premiação em sorteio, e deve possuir poder repressivo, inibidor e, por outro, formador de cultura ética mais elevada. Com isto, tendo em vista as atividades exercidas pelas partes, a gravidade do evento, as consequências do defeito na prestação de serviço para a parte autora, considerando-se ainda, os critérios de prudência e razoabilidade e o poder repressivo e formador, fixo o valor da indenização por danos morais em R$ 5.000,00 (cinco mil reais). 3. Ante o exposto, nos termos do artigo 487, inciso I, do Código de Processo Civil,",". 2. É caso de julgamento antecipado nos termos do artigo 355, I, do CPC, pois ambas as partes não demonstraram interesse na produção de outras provas. No mérito, os pedidos são procedentes em parte. Narra a parte autora que houve defeito na prestação do serviço, caracterizado pelas informações incorretas, contratação de má-fé, e cobranças abusivas. A legislação consumerista estabeleceu a responsabilidade objetiva do fornecedor de produtos ou serviços, ou seja, a espécie de responsabilidade em que não é necessária a perquirição acerca da presença de dolo ou culpa por parte do agente. O questionamento cinge-se a existência de dano e de nexo de causalidade, responsabilizando-se o agente sempre que presentes, salvo se existente eventual causa excludente de responsabilidade. De fato, dispõe o art. 14, do Código de Defesa do Consumidor, que: “O fornecedor de serviços responde, independentemente da existência de culpa, pela reparação dos danos causados aos consumidores por defeitos relativos à prestação de serviços, bem como por informações insuficientes ou inadequadas sobre sua fruição e riscos”. Como se vê, a responsabilidade civil, nas relações de consumo, “...se aperfeiçoa mediante o concurso de três pressupostos: a) defeito do serviço; b) evento danoso; c) relação de causalidade entre o defeito do serviço e o dano” (GRINOVER, Ada Pellegrini; BENJAMIN, Antônio Herman de Vasconcellos e; FINK, Daniel Roberto et. alli. Código brasileiro de defesa do consumidor. 2. ed. Rio de Janeiro: Forense Universitária, 1992. p. 93). No caso vertente, todos esses requisitos estão presentes. No que tange ao defeito na prestação do serviço, as provas indicam que funcionária (Ana Fernanda Takahashi) da autora SEA Peças Ltda., foi induzida ao preenchimento de formulário de atualização cadastral, que na verdade era “Contrato de Figuração”, e com cláusulas obscuras. Não restou comprovado que a Ana Fernanda Takahashi possuía poderes para contratar em nome da autora SEA Peças Ltda., que devia ter requerido a comprovação de que a coautora possuía tais poderes, não cabendo, no caso concreto, a alegação de Teoria da Aparência, por parte da requerida, uma vez que restam claros os indícios de fraude, ainda mais considerando que a requerida trata-se de empresa especializada em publicidade, não podendo alegar desconhecimento de tal exigência. Nesse sentido, já decidiu o Egrégio Tribunal de Justiça do Estado de São Paulo, em demandas idênticas, contra a mesma empresa ora requerida: APELAÇÃO. Ação declaratória de inexigibilidade de débito. Prestação de serviços. Publicidade em lista telefônica. Funcionária da empresa autora que preencheu formulário convencida de que se tratava de mera atualização cadastral. Formulário que se tratava de \"Contrato de Figuração\". Objeto contratual que não é descrito de forma clara e objetiva. Contrato que não prevê expressamente o valor do serviço prestado. Ausência de efetiva prestação do serviço de edição. Assinatura lançada por funcionário sem poderes de representação. Contratada que não exigiu documento comprobatório da existência de poderes de representação. Teoria da aparência que pode ser afastada ante os indícios da ocorrência do \"Golpe da lista telefônica\". Declaração de inexigibilidade do débito que deve ser mantida. Dano moral. Ocorrência. Pessoa jurídica que pode sofrer dano moral, nos termos da Súmula 227 do STJ. Ofensa à honra objetiva. Protesto indevido que constitui dano in re ipsa. Quantum indenizatório fixado em R$ 8.000,00. Adequação aos princípios da razoabilidade e proporcionalidade. Sentença mantida. Recurso não provido. (TJSP; Apelação Cível 1010878-98.2023.8.26.0506; Relator (a): Pedro Paulo Maillet Preuss; Órgão Julgador: 24ª Câmara de Direito Privado; Foro de Ribeirão Preto - 1ª Vara Cível; Data do Julgamento: 21/05/2024; Data de Registro: 21/05/2024) APELAÇÃO AÇÃO DECLARATÓRIA DE NULIDADE CONTRATUAL C/C INDENIZATÓRIA CONTRATO DE PRESTAÇÃO DE SERVIÇOS DE PUBLICIDADE EM SÍTIO ELETRÔNICO Instrumento subscrito por empregado sem poderes de representação Nulidade do negócio entabulado TEORIA DA APARÊNCIA Inaplicabilidade Inescusável a conduta da empresa demandada que adota \"modus operandi\" negligente e sabidamente falho, encaminhando proposta sucinta, sem dispensar qualquer cuidado com a pessoa que a recebe ou explicitar os termos da pretensa contratação, procedimento incompatível com a boa-fé objetiva (artigos 113, 187 e 422 do CC) Empresa especializada no ramo, afastando presunção de boa-fé subjetiva DANOS MORAIS Configuração Nos casos de protesto indevido, o dano moral se configura \"in re ipsa\", ainda que se trate de pessoa jurídica Precedentes do Superior Tribunal de Justiça \"QUANTUM\" INDENIZATÓRIO Indenização arbitrada em R$ 10.000,00 que, diante das circunstâncias do caso, se mostra adequada para sanar de forma justa a lide, atendendo aos princípios da razoabilidade e proporcionalidade Negado provimento. (TJSP; Apelação Cível 1134862-13.2022.8.26.0100; Relator (a): Hugo Crepaldi; Órgão Julgador: 25ª Câmara de Direito Privado; Foro Central Cível - 37ª Vara Cível;
