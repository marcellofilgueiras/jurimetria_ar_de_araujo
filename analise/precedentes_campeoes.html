GITALMENTE NOS TERMOS DA LEI 11.419/2006, CONFORME IMPRESSÃO À MARGEM DIREITA","JULGO PARCIALMENTE PROCEDENTE a presente AÇÃO DECLARATÓRIA DE INEXISTÊNCIA DE DÉBITO c.c. RESCISÃO CONTRATUAL COM REPETIÇÃO DE INDÉBITO E INDENIZAÇÃO POR DANOS MORAIS, ajuizada por DROGARIA SANCHES & PONTES LTDA ME em face da empresa A R DE ARAÚJO COMUNICAÇÕES ME para: a) declarar rescindido o contrato celebrado entre as partes e declarar como inexigíveis valores decorrentes de tal contração; b) tornar definitiva a tutela de urgência concedida às fls. 21; c) condenar a parte requerida a restituir ao autor os valores eventualmente cobrados em decorrência do aludido contrato, que deverão ser efetivamente comprovados nos autos, corrigido monetariamente desde o(s) desembolso(s); d) condenar a requerida a pagar à parte autora, a título de indenização por danos morais, a importância de R$5.000,00 (Cinco mil reais), que deverá ser atualizada monetariamente a partir da presente data. A atualização monetária deverá obedecer os referenciais da Tabela Prática do Tribunal de Justiça. Sobre o valor total deverá ser acrescido juros de mora de 1% ao mês (artigo 406 do CC) a contar da citação (artigo 405 do CC e artigo 219, caput, do CPC). Nos procedimentos do Juizado Especial Cível de ","JULGO PROCEDENTE o pedido em face de A R DE ARAÚJO COMUNICAÇÕES ME, e o faço para: (a) declarar a nulidade do Contrato de Figuração nº 102406G, firmado em 01/11/2022, reconhecendo a inexistência de relação jurídica válida entre as partes; (b) declarar a inexigibilidade do débito dele decorrente, no valor de R$ 4.200,00 (quatro mil e duzentos reais) ou qualquer outro montante correlato; (c) tornar definitiva a tutela de urgência concedida às fls. 35/40, determinando a sustação definitiva do protesto do título nº 102406G, lavrado no 2º Tabelião de Protesto de Letras e Títulos de Ribeirão Preto/SP, com seu cancelamento definitivo, às expensas da requerida; (d) condenar a requerida a restituir à autora o valor de R$ 1.139,42, corrigido desde o desembolso (16/07/2025) e acrescido de juros de mora a contar da citação. A correção monetária e os juros de mora terão incidência nos termos dos artigos 389 e 406, ambos do Código Civil, com a observância das alterações efetivadas pela Lei n° 14.905/2024, do seguinte modo: (1) até o dia 27/08/2024 (dia anterior à entrada em vigor da Lei n°14.905, de 2024), a correção monetária dar-se-á nos termos da Tabela Prática do Tribunal de Justiça do Estado de São Paulo, com acréscimo de juros de mora de 1% ao mês (12% ao ano); (2) a partir do dia 28/08/2024 (início da vigência da Lei n° 14.905, de 2024), os índices serão os seguintes: (a) IPCA, quando incidir apenas correção monetária; (b) taxa SELIC, com dedução do IPCA, quando incidirem apenas os juros de mora (artigo 406, § 1º, do Código Civil), adotando-se, para este caso, a metodologia divulgada pelo Conselho Monetário Nacional (Resolução nº 5.171, de 2024); (c) taxa SELIC, quando incidir conjuntamente correção monetária e juros de mora, observando-se, quanto aos juros de mora, que incidirão desde a citação. Condeno a ré ao pagamento das custas processuais e honorários advocatícios sucumbenciais, que fixo em 15% sobre o valor da condenação, nos termos do art. 85, § 2º, do Código de Processo Civil. Interposto recurso de apelação, intime-se a parte recorrida para contrarrazões. Certifiquem, se necessário, a respeito do valor do preparo e da quantia efetivamente recolhida (NSCGJ., art. 102, VI), observado o valor da condenação como base de cálculo, com vinculação do documento ao número do processo (NSCGJ. Art. 1093, parágrafo 6º), reservada à instância superior a apreciação de eventuais irregularidades. Após, independente de juízo de admissibilidade, remetam-se os autos ao Egrégio Tribunal de Justiça do Estado de São Paulo, nos termos do art. 1.010, § 3º, do Código de Processo Civil. Oportunamente, cópia desta sentença deverá ser enviada ao 2º Tabelião de Protesto de Letras e Títulos de Ribeirão Preto/SP, comunicando o teor desta decisão. P.I. Ribeirão Preto, 14 de novembro de 2025. HEBER MENDES BATISTA Juiz de Direito (ass. Digital)","JULGO PROCEDENTE a presente ação movida por ALEXANDRE CARROZZA E CIA LTDA em face de A. R. DE ARAÚJO COMUNICAÇÕES ME, o que faço para o fim de declarar a inexistência de relação jurídica entre as partes, a nulidade do contrato de figuração nº 110031 (fls. 103/104) e a inexigibilidade de valores relacionados a esta avença. Condeno a ré à obrigação de não efetuar novas cobranças e novos protestos relativos a esse contrato e a pagar à autora uma indenização por danos morais no valor de R$ 3.000,00, quantia que deverá ser devidamente atualizada com juros de mora de 1% ao mês desde a data do evento danoso (Súmula 54 do STJ), ou seja, desde a indicação a protesto indevido (18/03/2025 fl. 26), e correção monetária desde a data do arbitramento (Súmula 362 do STJ). Ainda, condeno a requerida a restituir à autora, em dobro, os valores eventualmente pagos, relativos ao contrato em questão, que deverão ser comprovados em cum","julgo procedentes os pedidos formulados na inicial, resolvendo o mérito na forma do art. 487, I, do CPC, para declarar inexistente a contratação discutida, confirmando a liminar para evitar qualquer inscrição do CNPJ da autora em cadastros de inadimplentes e, por fim, para determinar a restituição à autora da quantia de R$ 1.540,00, com juros e correção pela Tabela Prática desde o pagamento indevido. Custas pela ré. Fixo honorários aos procuradores da autora em 10% do valor corrigido da causa. Sentença publicada e registrada eletronicamente. ","julgo PROCEDENTE a ação movida por LUMIERE VEÍCULOS LTDA contra A. R. DE ARAÚJO COMUNICAÇÕES ME - LISTA REGIONAL BRASIL, nos termos do artigo 487, inciso I, do Código de Processo Civil, para declarar a nulidade do “contrato de figuração nº 101603G” (fls.30) e, em consequência, a inexistência da relação jurídica a ele vinculada, a inexigibilidade do débito cobrado. Torno definitiva a tutela de urgência (fls. 122/123). A requerida responde pelas custas e despesas do processo, bem como pelo pagamento da verba honorária que fixo em R$1.300,00 (hum mil e trezentos reais). ","JULGO PARCIALMENTE PROCEDENTES OS PEDIDOS, resolvendo o mérito da ação na forma do inc. I do art. 487 do CPC, para declarar inexistente a duplicata mercantil por indicação nº 99308G, no valor de R$1.050,00, emitida e vencida no dia 12.03.2025 sacada pela ré contra a autora e, por consequência, determinar o cancelamento do protesto efetivado pelo 1º Tabelião de Protesto de Letras e Títulos desta Comarca no dia 25.03.2025, sob o protocolo nº 21 de 18.03.2025. 4.1. Diante da sucumbência recíproca, noto que a autora sucumbiu em um dos seus três pedidos (declaratório, obrigação de fazer e danos morais). Assim, condeno a requerida a pagar 1/3 (um terço) das despesas processuais adiantadas pela autora e a 1/3 (um terço) dos honorários advocatícios do patrono dela, que ora arbitro em 10% (dez por cento) sobre o valor da causa atualizado desde a propositura da demanda até a presente data (proveito econômico obtido), em observância ao §2º do art. 85 do CPC. Nos termos do art. §16 do art. 85 do CPC, o valor dos honorários advocatícios será corrigido monetariamente pelo IPCA a partir da data da prolação desta sentença; e acrescido de juros de mora a partir do trânsito em julgado, calculados pela taxa SELIC nos termos do art. 406 do CC, com a redação dada pela Lei 14.905/2024. 4.2. Em atenção ao disposto no §2º do art. 4º da Lei Estadual 11.608/2003, fixo o valor da causa como a base de cálculo do preparo. 4.3. Com o trânsito em julgado, a) expeça-se mandado ao 1º Tabelionato de Protesto de Letras e Títulos desta Comarca para que proceda ao cancelamento do protesto do título referido no item “4.1” supra, e para que remeta o título protestado ao Juízo caso seja físico, nos termos do §3º do art. 17 da Lei 9.492/97. Faça-se constar que o cum","JULGO PROCEDENTE o pedido e declarar nula a duplicata mercantil nº 100136G, no valor de R$ 1.050,00, mantida a liminar, inclusive para determinar a sustação definitiva do protesto, arcando a ré com o pagamento das custas e despesas processuais, corrigidas desde o efetivo desembolso, mais honorários advocatícios dos patronos da autora, que arbitro em R$ 2.000,00, o que faço com fundamento no Art. 85, §§ 2º e 8º, do Código de Processo Civil. P.I. Ribeirão Preto, 18 de março de 2024. HÉBER MENDES BATISTA Juiz de Direito (ass. Digital)","JULGO PROCEDENTES os pedidos, com fulcro no artigo 487, I, do Código de Processo Civil, para: a) DECLARAR rescindido o instrumento contratual sob nº 7554G; b) DECLARAR a inexigibilidade do débito oriundo do contrato referido, objeto do apontamento restritivo junto ao cadastrado de inadimplentes mantido pela SERASA, assim como da duplicata mercantil sob nº 7554G, no valor de R$ 630,00, levada a protesto perante o Tabelião de Protestos da Comarca de Cunha, SP, tornando definitiva a tutela de urgência outrora concedida; c) CONDENAR a demandada ao pagamento da importância de R$ 10.000,00 a título de compensação financeira pelos danos morais suportados, acrescida de correção monetária a partir do arbitramento e de juros legais de 1% ao mês desde a citação. Em razão da sucumbência da ré GUIA PLUS, condeno-a ao pagamento das custas, despesas processuais e honorários advocatícios que ora arbitro em 10% da condenação, nos termos do artigo 85, § 2º do Código de Processo Civil. Após o trânsito em julgado, servirá a presente sentença como ofício a ser encaminhado pela requerente ao Tabelião de Protestos da Comarca de Cunha, SP, a fim de noticiar o cancelamento definitivo do protesto. P. I. São Paulo, 18/4/2022. SANG DUK KIM JUIZ DE DIREITO (Assinado digitalmente) DOCUMENTO ASSINADO DIGITALMENTE NOS TERMOS DA LEI 11.419/2006, CONFORME IMPRESSÃO À MARGEM DIREITA","JULGO PROCEDENTE a ação movida por Vecol Veiculos Ltda em face de A R de Araújo Comunicações-me (Guia Plus), e o faço com fundamento no artigo 487, inciso I, do Código de Processo Civil para para DECLARAR a inexistência da relação jurídica contratual entre as partes e, consequentemente, inexigível qualquer cobrança relacionada à contratação, confirmando a tutela de urgência concedida. Em razão da sucumbência, condeno a parte requerida em custas, despesas processuais e honorários advocatícios fixados em 10% do valor da causa, na forma do artigo 85,§ 2ª, CPC. Em consequência, julgo o feito extinto, nos termos do artigo 487, inciso I, do Código de Processo Civil. Restam as partes advertidas que eventuais embargos de declaração com efeitos de mera reapreciação do quanto decidido serão tidos como protelatórios, podendo ser apenados com as sanções do artigo 1.026, §2º, do Código de Processo. Certificado o trânsito em julgado, nada mais sendo requerido, arquivem-se os autos observadas as formalidades legais. P.I.C. São Paulo, data da assinatura digital.","Pelo exposto, JULGAM-SE PROCEDENTES os pedidos iniciais formulados por V. R. MEUCCI & CIA LTDA, nos termos do artigo 487, inciso I do Código de Processo Civil para: 1 Declarar a exigibilidade do débito no valor de R$ 250,00 protestado em 01.06.2022 e cancelar, de forma definitiva, o protesto lavrado no Livro 313-G, folha 123, confirmando-se a tutela de urgência. Os emolumentos da serventia extrajudicial devem ser arcadas pela parte ré. 2 Condenar, A. R. DE ARAÚJO COMUNICAÇÕES ME GUIA PLUS o pagamento de indenização por danos morais no importe de R$ 5.000,00 (cinco mil reais), atualizado monetariamente desde esta data (arbitramento), nos termos da Tabela Prática do Tribunal de Justiça, e acrescidos de juros moratórios, fixados em 1%ao mês, a partir da citação até o efetivo pagamento. Condena-se ainda a ré em custas processuais e honorários advocatícios, que arbitra-se em 10% (dez por cento) sobre o valor da condenação, com fundamento no artigo 85, parágrafo 2º, do Código de Processo Civil. P.I.C. Laranjal Paulista, 23 de março de 2023. ELIANE CRISTINA CINTO JUÍZA DE DIREITO DOCUMENTO ASSINADO DIGITALMENTE NOS TERMOS DA LEI 11.419/2006, CONFORME IMPRESSÃO À MARGEM DIREITA","Ante o exposto, confirma-se a tutela de urgência (fls.66/67) e julga-se procedente o pedido inicial proposto por Gerson Miranda Moreira ME contra A. R. de Araújo Comunicações ME - Lista Regional Brasil, nos termos do artigo 487, inciso I, do Código de Processo Civil, para: a) declarar nulo o contrato de prestação de serviços (fls.33); b) declarar inexigíveis os valores cobrados, bem como o pagamento de multa rescisão antecipada do contrato e, por consequência; c) determinar a exclusão do nome da requerente do cadastro de inadimplentes dos órgãos de proteção ao crédito, de forma definitiva, em relação aos débitos discutidos nesta demanda; d) determinar o cancelamento definitivo do protesto do título nº 34100 L, no valor de R$290,00, emitido em 03 de maio de 2022, no 1º Tabelionato de Notas e de Protesto de Jacareí-SP (fls.61); e) condenar a requerida a restituir à requerente os valores pagos, com correção monetária pelo índice da Tabela Prática do Tribunal de Justiça de São Paulo, desde a data de cada pagamento e juros de mora de 1% ao mês, a partir da citação, f) condenar a requerida a pagar à requerente a importância de R$5.000,00 (cinco mil reais), a título de danos morais, valor que deverá ser acrescido de correção monetária pelos índices da Tabela Prática do Tribunal de Justiça, a partir da prolação desta sentença e juros de mora de 1% ao mês a partir da citação. Condeno a requerida, integralmente, ao pagamento das custas e despesas processuais, corrigidas desde o desembolso, e dos honorários advocatícios que arbitro em 10% sobre o valor da condenação, suspendendo-lhe o pagamento, caso esteja acobertada pelo benefício da gratuidade, ressalvada a hipótese prevista no artigo 98 e seus parágrafos 2º e 3º do Código de Processo Civil (Lei 13.105/15). Cópia da presente sentença, assinada digitalmente e acompanhada das cópias necessárias ao seu cum","julgo procedentes em parte os pedidos para: a) declarar nulo o contrato descrito na petição inicial e consequentemente inexigível em relação à autora os débitos nele descritos; b) rejeitar o pleito de reparação de danos morais; c) por conta da sucumbência recíproca, cada parte arcará com 50% das custas e despesas processuais e com os honorários advocatícios do patrono da parte contrária, que fixo e arbitra em 10% do valor corrigido da causa, atendidos os requisitos do art. 85, §§ 2º, I a IV, combinado com o art. 86, caput, ambos do Código de Processo Civil de 2015; e) oficie-se oportunamente para sustação do protesto. Se interposta apelação contra esta sentença e também eventual recurso adesivo, como nos termos do Código de Processo Civil de 2015, cabe apenas à instância ad quem examinar os requisitos e pressupostos objetivos e subjetivos de admissibilidade recursal (art. 1.010, § 3º), providencie a serventia a intimação da parte apelada e/ou da parte recorrente em caráter adesivo pra apresentar, se quiser, as correspondentes contrarrazões, no prazo de quinze dias (art. 1.010, § 1º), sob pena de preclusão e, após, independentemente de nova decisão ou despacho, remeta-se os autos do processo judicial eletrônico (digital) ao Tribunal de Justiça do Estado de São Paulo, Seção de Direito ","JULGO PROCEDENTE a ação movida por AÇO NOBRE INDÚSTRIA LTDA. em face de A R DE ARAÚJO COMUNICAÇÕES GUIA PLUS, para condenar a ré à restituição do valor total de R$ 6.384,00, de forma dobrada, computados correção monetária e juros de mora das datas dos desembolsos, bem como a indenizar o dano moral, no valor de R$ 6.384,00, com correção monetária e juros de mora contados da citação, declarando extinto o processo, nos termos do art. 487, I, CPC. Condeno a ré nas custas e despesas processuais e honorários advocatícios que fixo em 20% sobre o valor da condenação. P.I. Campinas, 28 de janeiro de 2025. DOCUMENTO ASSINADO DIGITALMENTE NOS TERMOS DA LEI 11.419/2006, CONFORME IMPRESSÃO À MARGEM DIREITA","JULGO PARCIALMENTE PROCEDENTE a pretensão inicial, para declarar rescindido o contrato entre as partes celebrado, declarando, outrossim, inexigíveis da autora débitos futuros provenientes da avença. Por ter sucumbido, arcará a ré com o pagamento de metade das custas e despesas processuais, bem como de honorários advocatícios fixados em R$5.203,07, como determina o artigo 85, §§8º, 8º-A e 14, do Código de Processo Civil. Pela mesma razão, arcará a autora com o pagamento de metade das custas e despesas processuais, bem como de honorários advocatícios fixados em R$5.203,07, como determina o artigo 85, §§8º, 8º-A e 14, do Código de Processo Civil. P.I.C.. São Paulo, 31 de outubro de 2022. DOCUMENTO ASSINADO DIGITALMENTE NOS TERMOS DA LEI 11.419/2006, CONFORME IMPRESSÃO À MARGEM DIREITA"]],"container":"<table class=\"display\">\n  <thead>\n    <tr>\n      <th>score_total<\/th>\n      <th>score_temas<\/th>\n      <th>score_proced<\/th>\n      <th>score_tutela<\/th>\n      <th>score_valor<\/th>\n      <th>processo<\/th>\n      <th>data<\/th>\n      <th>ano<\/th>\n      <th>comarca<\/th>\n      <th>vara<\/th>\n      <th>magistrado<\/th>\n      <th>resultado_dispositivo<\/th>\n      <th>valor_indenizacao<\/th>\n      <th>tem_protesto<\/th>\n      <th>tem_duplicata<\/th>\n      <th>tem_rel_juridica<\/th>\n      <th>tem_contrato<\/th>\n      <th>tem_tutela_deferida<\/th>\n      <th>dispositivo_trecho<\/th>\n      <th>dispositivo_txt<\/th>\n    <\/tr>\n  <\/thead>\n<\/table>","options":{"pageLength":30,"scrollX":true,"autoWidth":false,"dom":"Blfrtip","buttons":["csv","excel"],"order":[[0,"desc"]],"columnDefs":[{"targets":12,"render":"function(data, type, row, meta) {\n    return type !== 'display' ? data : DTWidget.formatCurrency(data, \"R$ \", 0, 3, \".\", \",\", true, null);\n  }"},{"width":"500px","targets":[18,19]},{"className":"dt-center","targets":[0,1,2,3,4]},{"className":"dt-left","targets":"_all"},{"name":"score_total","targets":0},{"name":"score_temas","
